# Ownership map for op_tests that only `import aiter`.
#
# aiter/__init__.py re-exports ~60 modules with `import *`, so these tests
# depend on everything in the import graph. This table says what each one
# actually exercises, so .github/scripts/select_aiter_tests.py can map a diff
# to them. Tests that resolve through the import graph are NOT listed here.
#
# Generated draft -- every entry needs an owner's review before trusting it.
# A bare-import test missing from this file makes CI run the full suite and
# fail the consistency check in tests/test_aiter_test_map.py.
#
# `owns`: paths whose change selects this test. `cpu_only: true` marks tests
# that drive no GPU op (they are selected only by their own change).

