name: Radeon xsj-dispatch dispatch test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/radeon-gfx1201-dispatch-test.yaml

jobs:
  gfx1201:
    runs-on: [self-hosted, linux, devlab-dispatch, xsj-dispatch]
    steps:
      - name: Check gfx1201 runner
        run: |
          set +e
          echo "runner=${RUNNER_NAME}"
          uname -a
          command -v rocm-smi && rocm-smi
          command -v rocminfo && rocminfo | grep -m1 gfx
          ls -l /dev/kfd /dev/dri/render* 2>/dev/null
