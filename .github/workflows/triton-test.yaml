name: Triton Test

on:
  push:
    branches: [main]
  pull_request:
    # labeled: re-run when adding ci:triton-300x (adds the MI300X jobs) or
    # ci:triton-full (runs the whole suite instead of the diff selection).
    # MI300X stays opt-in: only ci:triton-300x starts it.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]
    paths:
      # Triton tests also depend on shared aiter modules and test helpers.
      # The selector falls back to the full suite for inputs outside its graph.
      - "aiter/**"
      - "op_tests/**"
      - "pyproject.toml"
      - "setup.py"
      - "setup.cfg"
      - "requirements*.txt"
      - "conftest.py"
      - "pytest.ini"
      - ".github/scripts/build_aiter_triton.sh"
      - ".github/scripts/download_triton_wheel.sh"
      - ".github/scripts/ensure_zstd.sh"
      - ".github/scripts/install_triton.sh"
      - ".github/scripts/select_triton_tests.py"
      - ".github/scripts/tests/**"
      - ".github/scripts/split_tests.sh"
      - ".github/scripts/verify_triton_pin.py"
      - ".github/requirements/triton-test.txt"
      # Docs-only changes (README.md, configs/CLAUDE.md, conv/DESIGN.md, ...)
      # don't affect test results — skip the test suites when a PR touches
      # nothing else.
      - "!**/*.md"
      - '!docs/**'
      - '!LICENSE'
      - '!.gitignore'
      - '!.github/workflows/**'
      - '!.github/scripts/sglang_downstream.py'
      # Re-include Triton workflow files after the broad workflow exclusion.
      - ".github/workflows/triton-test.yaml"
      - ".github/workflows/prepare-triton-wheel.yaml"
      - ".github/workflows/ci-config.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci_config:
    if: ${{ (!github.event.pull_request || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.action != 'labeled' || contains(fromJSON('["ci:triton-300x", "ci:triton-full"]'), github.event.label.name)) }}
    uses: ./.github/workflows/ci-config.yaml

  check-signal:
    if: ${{ (!github.event.pull_request || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.action != 'labeled' || contains(fromJSON('["ci:triton-300x", "ci:triton-full"]'), github.event.label.name)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Checks workflow
        run: ./.github/scripts/check_signal.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}

  # Step 1: split triton tests into 8 shards, output triton_shard_0.list ... triton_shard_7.list
  split_triton_tests:
    if: ${{ (!github.event.pull_request || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.action != 'labeled' || contains(fromJSON('["ci:triton-300x", "ci:triton-full"]'), github.event.label.name)) }}
    runs-on: ubuntu-latest
    needs: [check-signal]
    outputs:
      shard_count: 8
      # Zero when the diff selects nothing (a benchmark-only PR). The shard
      # jobs skip on it, so the check reads "skipped" rather than "passed"
      # over a run that executed no tests.
      selected_count: ${{ steps.select.outputs.selected_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Keep the event's merge commit and its base parent together. A
          # freshly fetched PR merge ref may have moved since this run began.
          fetch-depth: 2

      - name: Check Triton test selection
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Select Triton tests from PR diff
        id: select
        env:
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:triton-full') }}
        run: |
          set -ex
          # PRs run the paired test for each edited kernel plus every test
          # whose imports reach it. main pushes, nightly, manual runs and PRs
          # labeled ci:triton-full always run the full suite.
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$FULL_LABEL" != "true" ]; then
            python3 .github/scripts/select_triton_tests.py \
              --merge-ref HEAD --output selected_triton_tests.list
          else
            python3 .github/scripts/select_triton_tests.py \
              --all --output selected_triton_tests.list
          fi
          echo "selected_count=$(grep -c . selected_triton_tests.list || true)" >> "$GITHUB_OUTPUT"

      - name: Split Triton Tests (8 shards)
        run: ./.github/scripts/split_tests.sh --shards 8 --test-type triton --select-file selected_triton_tests.list

      - name: Upload test shard lists as artifact
        uses: actions/upload-artifact@v4
        with:
          name: triton_shards
          path: triton_shard_*.list
          retention-days: 7

  prepare_triton_wheel:
    if: ${{ (!github.event.pull_request || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.action != 'labeled' || contains(fromJSON('["ci:triton-300x", "ci:triton-full"]'), github.event.label.name)) }}
    needs: [check-signal, ci_config]
    uses: ./.github/workflows/prepare-triton-wheel.yaml
    with:
      docker-image: ${{ needs.ci_config.outputs.pytorch_py312_image }}
      artifact-name: ${{ needs.ci_config.outputs.triton_wheel_artifact_name }}
      retention-days: 3

  # Step 2: MI35X matrix jobs
  triton:
    if: ${{ (!github.event.pull_request || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.action != 'labeled' || contains(fromJSON('["ci:triton-300x", "ci:triton-full"]'), github.event.label.name)) && needs.split_triton_tests.outputs.selected_count != '0' }}
    name: Triton Tests (MI35X) / Shard ${{ matrix.shard }}
    runs-on: linux-aiter-mi35x-1
    timeout-minutes: 60
    needs: [split_triton_tests, prepare_triton_wheel, check-signal, ci_config]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      DOCKER_IMAGE: ${{ needs.ci_config.outputs.pytorch_py312_image }}
      TRITON_WHEEL_ARTIFACT_NAME: ${{ needs.ci_config.outputs.triton_wheel_artifact_name }}
      TRITON_TEST: "op_tests/triton_tests/"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'

      - name: Network preflight before Triton artifact downloads
        if: ${{ startsWith(runner.name, 'linux-aiter-mi35x-1-') }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set +e

          echo "=== Runner info ==="
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "hostname=$(hostname -f 2>/dev/null || hostname)"
          date -u

          echo "=== DNS check ==="
          getent hosts github.com || true
          getent hosts api.github.com || true
          getent hosts productionresultssa4.blob.core.windows.net || true
          getent hosts productionresultssa8.blob.core.windows.net || true

          echo "=== GitHub and Azure Blob connectivity check ==="
          for url in \
            https://api.github.com/rate_limit \
            https://github.com/ROCm/aiter \
            https://productionresultssa4.blob.core.windows.net/ \
            https://productionresultssa8.blob.core.windows.net/
          do
            curl -L -o /dev/null -sS \
              --connect-timeout 10 \
              --max-time 30 \
              -w "url=${url} code=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s speed=%{speed_download}B/s\n" \
              "$url" || true
          done

      - name: Download test shard lists
        id: download_triton_shards
        uses: actions/download-artifact@v4
        timeout-minutes: 15
        with:
          name: triton_shards

      - name: Ensure zstd for Triton wheel cache
        if: ${{ runner.os == 'Linux' }}
        run: ./.github/scripts/ensure_zstd.sh

      - name: Restore Triton wheel cache
        id: restore_triton_wheel
        continue-on-error: true
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 30
        with:
          path: triton_wheels
          key: ${{ needs.prepare_triton_wheel.outputs.cache_key }}

      - name: Download Triton wheel artifact
        if: steps.restore_triton_wheel.outputs.cache-hit != 'true'
        id: download_triton_wheel
        uses: actions/download-artifact@v4
        timeout-minutes: 30
        continue-on-error: true
        with:
          name: ${{ env.TRITON_WHEEL_ARTIFACT_NAME }}
          path: triton_wheels

      - name: Speedtest after Triton cache or artifact download failure
        if: ${{ always() && startsWith(runner.name, 'linux-aiter-mi35x-1-') && (steps.download_triton_shards.outcome == 'failure' || steps.restore_triton_wheel.outcome == 'failure' || steps.download_triton_wheel.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set +e

          echo "=== Runner info ==="
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "hostname=$(hostname -f 2>/dev/null || hostname)"
          date -u

          echo "=== speedtest-cli ==="
          python3 -m pip install --user --disable-pip-version-check speedtest-cli || true
          speedtest_bin="$(python3 -m site --user-base)/bin/speedtest-cli"
          timeout 120 "$speedtest_bin" --simple --secure || true

      - name: List test shard files
        run: |
          ls -l triton_shard_*.list

      - name: Docker login
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        env:
          DOCKER_USERNAME: ${{ secrets[needs.ci_config.outputs.docker_username_secret] }}
          DOCKER_PASSWORD: ${{ secrets[needs.ci_config.outputs.docker_password_secret] }}
        run: |
          for attempt in 1 2 3; do
            if echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin; then
              echo "Docker login succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Docker login attempt ${attempt} failed"
            if [ "${attempt}" != 3 ]; then
              sleep 10
            fi
          done
          echo "Docker login failed after 3 attempts, continuing anyway"
          exit 0

      - name: Export test file list for this shard as env
        id: set_shard_files
        run: |
          TRITON_TEST=$(cat triton_shard_${{ matrix.shard }}.list)
          echo "$TRITON_TEST"
          echo "TRITON_TEST=$TRITON_TEST" >> $GITHUB_ENV

      - name: Run the container
        run: |
          set -ex
          echo "Starting container: triton_test"

          if [ -f "/etc/podinfo/gha-render-devices" ]; then
            DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)
          else
            DEVICE_FLAG="--device /dev/dri"
          fi

          docker run -dt \
          --device=/dev/kfd $DEVICE_FLAG \
          --shm-size=16G \
          -e TRITON_WHEEL_DIR=/workspace/triton_wheels \
          --group-add $(getent group render | cut -d: -f3) \
          --group-add $(getent group video | cut -d: -f3) \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          --name triton_test \
          ${{ env.DOCKER_IMAGE }}

      - name: Setup Aiter and Triton
        run: |
          set -ex
          echo "Setting up Aiter and Triton..."
          docker exec -w /workspace triton_test ./.github/scripts/build_aiter_triton.sh

      - name: Triton Tests
        run: |
          set -exo pipefail
          echo "Running Triton Tests..."
          mkdir -p test-reports
          docker exec -w /workspace triton_test mkdir -p test-reports
          if [ -z "${TRITON_TEST// /}" ]; then
            # Diff-based selection picked no tests for this shard.
            echo "No tests selected for this shard — writing an empty report."
            docker exec -w /workspace triton_test bash -c "echo '<testsuites/>' > test-reports/triton.xml"
          else
            # MI35X: skip the MHA-PE tests that fail an accuracy check on gfx950 with the coming Triton release.
            # Unit tests must not autotune: surface any tuning and fail the job if it happened.
            docker exec -e TRITON_PRINT_AUTOTUNING=1 -w /workspace triton_test pytest -v -s ${TRITON_TEST} \
              --junitxml=test-reports/triton.xml 2>&1 | tee test-reports/pytest.log
            if grep -q "Triton autotuning for function" test-reports/pytest.log; then
              echo "::error::runtime autotuning ran inside unit tests"
              # Name them here as well as in the artifact: the log is long, and
              # the whole point of the gate is which kernel tuned.
              grep -n "Triton autotuning for function" test-reports/pytest.log | head -20 || true
              exit 1
            fi
          fi

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        # Not success(): a shard that trips the autotuning gate is exactly the
        # run whose log is worth keeping, and success() skips the upload for
        # it -- so the evidence only ever existed in the live Actions log,
        # which expires.
        if: ${{ !cancelled() }}
        with:
          name: triton-test-shard-${{ matrix.shard }}
          path: |
            test-reports/triton.xml
            test-reports/pytest.log
          retention-days: 7
          # A shard that died before pytest ran has neither file, which is not
          # itself an error worth failing the upload over.
          if-no-files-found: ignore

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f triton_test || true

  # Step 2b: MI300X matrix jobs (opt-in via ci:triton-300x on PRs, always on main)
  triton-mi300x:
    if: ${{ (!github.event.pull_request || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.action != 'labeled' || contains(fromJSON('["ci:triton-300x", "ci:triton-full"]'), github.event.label.name)) && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:triton-300x'))) && needs.split_triton_tests.outputs.selected_count != '0' }}
    name: Triton Tests (MI300X) / Shard ${{ matrix.shard }}
    runs-on: linux-aiter-oci-mi300x-1
    timeout-minutes: 60
    needs: [split_triton_tests, prepare_triton_wheel, check-signal, ci_config]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      DOCKER_IMAGE: ${{ needs.ci_config.outputs.pytorch_py312_image }}
      TRITON_WHEEL_ARTIFACT_NAME: ${{ needs.ci_config.outputs.triton_wheel_artifact_name }}
      TRITON_TEST: "op_tests/triton_tests/"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'

      - name: Download test shard lists
        uses: actions/download-artifact@v4
        timeout-minutes: 15
        with:
          name: triton_shards

      - name: Ensure zstd for Triton wheel cache
        if: ${{ runner.os == 'Linux' }}
        run: ./.github/scripts/ensure_zstd.sh

      - name: Restore Triton wheel cache
        id: restore_triton_wheel
        continue-on-error: true
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 30
        with:
          path: triton_wheels
          key: ${{ needs.prepare_triton_wheel.outputs.cache_key }}

      - name: Download Triton wheel artifact
        if: steps.restore_triton_wheel.outputs.cache-hit != 'true'
        id: download_triton_wheel
        uses: actions/download-artifact@v4
        timeout-minutes: 30
        continue-on-error: true
        with:
          name: ${{ env.TRITON_WHEEL_ARTIFACT_NAME }}
          path: triton_wheels

      - name: List test shard files
        run: |
          ls -l triton_shard_*.list

      - name: Docker login
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        env:
          DOCKER_USERNAME: ${{ secrets[needs.ci_config.outputs.docker_username_secret] }}
          DOCKER_PASSWORD: ${{ secrets[needs.ci_config.outputs.docker_password_secret] }}
        run: |
          for attempt in 1 2 3; do
            if echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin; then
              echo "Docker login succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Docker login attempt ${attempt} failed"
            if [ "${attempt}" != 3 ]; then
              sleep 10
            fi
          done
          echo "Docker login failed after 3 attempts, continuing anyway"
          exit 0

      - name: Export test file list for this shard as env
        id: set_shard_files
        run: |
          TRITON_TEST=$(cat triton_shard_${{ matrix.shard }}.list)
          echo "$TRITON_TEST"
          echo "TRITON_TEST=$TRITON_TEST" >> $GITHUB_ENV

      - name: Run the container
        run: |
          set -ex
          echo "Starting container: triton_test"

          if [ -f "/etc/podinfo/gha-render-devices" ]; then
            DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)
          else
            DEVICE_FLAG="--device /dev/dri"
          fi

          docker run -dt \
          --device=/dev/kfd $DEVICE_FLAG \
          --shm-size=16G \
          -e TRITON_WHEEL_DIR=/workspace/triton_wheels \
          --group-add $(getent group render | cut -d: -f3) \
          --group-add $(getent group video | cut -d: -f3) \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          --name triton_test \
          ${{ env.DOCKER_IMAGE }}

      - name: Setup Aiter and Triton
        run: |
          set -ex
          echo "Setting up Aiter and Triton..."
          docker exec -w /workspace triton_test ./.github/scripts/build_aiter_triton.sh

      - name: Triton Tests
        run: |
          set -exo pipefail
          echo "Running Triton Tests..."
          mkdir -p test-reports
          docker exec -w /workspace triton_test mkdir -p test-reports
          if [ -z "${TRITON_TEST// /}" ]; then
            # Diff-based selection picked no tests for this shard.
            echo "No tests selected for this shard — writing an empty report."
            docker exec -w /workspace triton_test bash -c "echo '<testsuites/>' > test-reports/triton.xml"
          else
            # Unit tests must not autotune: surface any tuning and fail the job if it happened.
            docker exec -e TRITON_PRINT_AUTOTUNING=1 -w /workspace triton_test pytest -v -s ${TRITON_TEST} \
              --junitxml=test-reports/triton.xml 2>&1 | tee test-reports/pytest.log
            if grep -q "Triton autotuning for function" test-reports/pytest.log; then
              echo "::error::runtime autotuning ran inside unit tests"
              # Name them here as well as in the artifact: the log is long, and
              # the whole point of the gate is which kernel tuned.
              grep -n "Triton autotuning for function" test-reports/pytest.log | head -20 || true
              exit 1
            fi
          fi

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        # Not success(): a shard that trips the autotuning gate is exactly the
        # run whose log is worth keeping, and success() skips the upload for
        # it -- so the evidence only ever existed in the live Actions log,
        # which expires.
        if: ${{ !cancelled() }}
        with:
          name: triton-test-mi300x-shard-${{ matrix.shard }}
          path: |
            test-reports/triton.xml
            test-reports/pytest.log
          retention-days: 7
          # A shard that died before pytest ran has neither file, which is not
          # itself an error worth failing the upload over.
          if-no-files-found: ignore

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f triton_test || true

  triton-mi300x-test-finish:
    # Report dependency failures even when the GPU matrix was skipped. A
    # successful empty selection is the only preparation result we skip.
    if: ${{ !cancelled() && (!github.event.pull_request || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.action != 'labeled' || contains(fromJSON('["ci:triton-300x", "ci:triton-full"]'), github.event.label.name)) && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:triton-300x'))) && (needs.split_triton_tests.outputs.selected_count != '0' || needs.split_triton_tests.result != 'success' || needs.prepare_triton_wheel.result != 'success' || needs.check-signal.result != 'success' || needs.ci_config.result != 'success') }}
    name: Triton MI300X Test Results
    runs-on: ubuntu-latest
    needs: [triton-mi300x, split_triton_tests, prepare_triton_wheel, check-signal, ci_config]
    steps:
      - name: Check prerequisite and MI300X job results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["JOB_RESULTS"])
          failed = False
          for name, job in jobs.items():
              result = job["result"]
              print(f"{name}: {result}")
              if result != "success":
                  print(f"::error::{name} did not succeed ({result})")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Download all MI300X test reports
        uses: actions/download-artifact@v4
        timeout-minutes: 15
        with:
          pattern: triton-test-mi300x-shard-*
          path: .

      - name: Check Triton MI300X Test Results
        run: |
          set -ex
          echo "Checking Triton MI300X Test Results..."
          all_passed=true
          for shard in {0..7}; do
            if [ ! -f triton-test-mi300x-shard-${shard}/triton.xml ]; then
              echo "MI300X test report for shard ${shard} not found."
              all_passed=false
              break
            fi
          done
          if [ "$all_passed" = true ]; then
            echo "All MI300X tests passed."
          else
            echo "MI300X test failures or errors detected."
            exit 1
          fi

  triton-test-finish:
    # Report dependency failures even when the GPU matrix was skipped. A
    # successful empty selection is the only preparation result we skip.
    if: ${{ !cancelled() && (!github.event.pull_request || !github.event.pull_request.draft) && (github.event_name != 'pull_request' || github.event.action != 'labeled' || contains(fromJSON('["ci:triton-300x", "ci:triton-full"]'), github.event.label.name)) && (needs.split_triton_tests.outputs.selected_count != '0' || needs.split_triton_tests.result != 'success' || needs.prepare_triton_wheel.result != 'success' || needs.check-signal.result != 'success' || needs.ci_config.result != 'success') }}
    name: Triton Test Results
    runs-on: ubuntu-latest
    needs: [triton, split_triton_tests, prepare_triton_wheel, check-signal, ci_config]
    steps:
      - name: Check prerequisite and MI35X job results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["JOB_RESULTS"])
          failed = False
          for name, job in jobs.items():
              result = job["result"]
              print(f"{name}: {result}")
              if result != "success":
                  print(f"::error::{name} did not succeed ({result})")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Download all test reports
        uses: actions/download-artifact@v4
        timeout-minutes: 15
        with:
          pattern: triton-test-shard-*
          path: .
      - name: Check Triton Test Results
        run: |
          set -ex
          echo "Checking Triton Test Results..."
          all_passed=true
          for shard in {0..7}; do
            if [ ! -f triton-test-shard-${shard}/triton.xml ]; then
              echo "Test report for shard ${shard} not found."
              all_passed=false
              break
            fi
          done
          if [ "$all_passed" = true ]; then
            echo "All tests passed."
          else
            echo "Test failures or errors detected."
            exit 1
          fi
