name: Triton Test

on:
  push:
    branches: [main]
  pull_request:
    # Selection skips unrelated changes; the result check is reported for every PR.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci_config:
    needs: [split_triton_tests]
    if: ${{ needs.split_triton_tests.outputs.selected_count != '0' }}
    uses: ./.github/workflows/ci-config.yaml

  check-signal:
    needs: [split_triton_tests]
    if: ${{ needs.split_triton_tests.outputs.selected_count != '0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Checks workflow
        run: ./.github/scripts/check_signal.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}

  # Step 1: split triton tests into 8 shards, output triton_shard_0.list ... triton_shard_7.list
  split_triton_tests:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      shard_count: 8
      selected_count: ${{ steps.select.outputs.selected_count }}
      needs_mi300x: ${{ steps.select.outputs.needs_mi300x == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:triton-300x') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Compare the event's merge commit with its base parent.
          fetch-depth: 2

      - name: Select Triton tests from PR diff
        id: select
        env:
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:triton-full') }}
        run: |
          set -ex
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$FULL_LABEL" != "true" ]; then
            python3 .github/scripts/select_triton_tests.py \
              --merge-ref HEAD --output selected_triton_tests.list
          else
            python3 .github/scripts/select_triton_tests.py \
              --all --output selected_triton_tests.list
          fi

      - name: Split Triton Tests (8 shards)
        run: ./.github/scripts/split_tests.sh --shards 8 --test-type triton --select-file selected_triton_tests.list

      - name: Upload test shard lists as artifact
        uses: actions/upload-artifact@v4
        with:
          name: triton_shards
          path: triton_shard_*.list
          retention-days: 7

  prepare_triton_wheel:
    if: ${{ needs.split_triton_tests.outputs.selected_count != '0' }}
    needs: [split_triton_tests, check-signal, ci_config]
    uses: ./.github/workflows/prepare-triton-wheel.yaml
    with:
      docker-image: ${{ needs.ci_config.outputs.pytorch_py312_image }}
      artifact-name: ${{ needs.ci_config.outputs.triton_wheel_artifact_name }}
      retention-days: 3

  # Step 2: MI35X matrix jobs
  triton:
    if: ${{ needs.split_triton_tests.outputs.selected_count != '0' }}
    name: Triton Tests (MI35X) / Shard ${{ matrix.shard }}
    runs-on: linux-aiter-mi35x-1
    timeout-minutes: 60
    needs: [split_triton_tests, prepare_triton_wheel, check-signal, ci_config]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      DOCKER_IMAGE: ${{ needs.ci_config.outputs.pytorch_py312_image }}
      TRITON_WHEEL_ARTIFACT_NAME: ${{ needs.ci_config.outputs.triton_wheel_artifact_name }}
      TRITON_TEST: "op_tests/triton_tests/"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'

      - name: Network preflight before Triton artifact downloads
        if: ${{ startsWith(runner.name, 'linux-aiter-mi35x-1-') }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set +e

          echo "=== Runner info ==="
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "hostname=$(hostname -f 2>/dev/null || hostname)"
          date -u

          echo "=== DNS check ==="
          getent hosts github.com || true
          getent hosts api.github.com || true
          getent hosts productionresultssa4.blob.core.windows.net || true
          getent hosts productionresultssa8.blob.core.windows.net || true

          echo "=== GitHub and Azure Blob connectivity check ==="
          for url in \
            https://api.github.com/rate_limit \
            https://github.com/ROCm/aiter \
            https://productionresultssa4.blob.core.windows.net/ \
            https://productionresultssa8.blob.core.windows.net/
          do
            curl -L -o /dev/null -sS \
              --connect-timeout 10 \
              --max-time 30 \
              -w "url=${url} code=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s speed=%{speed_download}B/s\n" \
              "$url" || true
          done

      - name: Download test shard lists
        id: download_triton_shards
        uses: actions/download-artifact@v4
        timeout-minutes: 15
        with:
          name: triton_shards

      - name: Ensure zstd for Triton wheel cache
        if: ${{ runner.os == 'Linux' }}
        run: ./.github/scripts/ensure_zstd.sh

      - name: Restore Triton wheel cache
        id: restore_triton_wheel
        continue-on-error: true
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 30
        with:
          path: triton_wheels
          key: ${{ needs.prepare_triton_wheel.outputs.cache_key }}

      - name: Download Triton wheel artifact
        if: steps.restore_triton_wheel.outputs.cache-hit != 'true'
        id: download_triton_wheel
        uses: actions/download-artifact@v4
        timeout-minutes: 30
        continue-on-error: true
        with:
          name: ${{ env.TRITON_WHEEL_ARTIFACT_NAME }}
          path: triton_wheels

      - name: Speedtest after Triton cache or artifact download failure
        if: ${{ always() && startsWith(runner.name, 'linux-aiter-mi35x-1-') && (steps.download_triton_shards.outcome == 'failure' || steps.restore_triton_wheel.outcome == 'failure' || steps.download_triton_wheel.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set +e

          echo "=== Runner info ==="
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "hostname=$(hostname -f 2>/dev/null || hostname)"
          date -u

          echo "=== speedtest-cli ==="
          python3 -m pip install --user --disable-pip-version-check speedtest-cli || true
          speedtest_bin="$(python3 -m site --user-base)/bin/speedtest-cli"
          timeout 120 "$speedtest_bin" --simple --secure || true

      - name: List test shard files
        run: |
          ls -l triton_shard_*.list

      - name: Docker login
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        env:
          DOCKER_USERNAME: ${{ secrets[needs.ci_config.outputs.docker_username_secret] }}
          DOCKER_PASSWORD: ${{ secrets[needs.ci_config.outputs.docker_password_secret] }}
        run: |
          for attempt in 1 2 3; do
            if echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin; then
              echo "Docker login succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Docker login attempt ${attempt} failed"
            if [ "${attempt}" != 3 ]; then
              sleep 10
            fi
          done
          echo "Docker login failed after 3 attempts, continuing anyway"
          exit 0

      - name: Export test file list for this shard as env
        id: set_shard_files
        run: |
          TRITON_TEST=$(cat triton_shard_${{ matrix.shard }}.list)
          echo "$TRITON_TEST"
          echo "TRITON_TEST=$TRITON_TEST" >> $GITHUB_ENV

      - name: Run the container
        run: |
          set -ex
          echo "Starting container: triton_test"

          if [ -f "/etc/podinfo/gha-render-devices" ]; then
            DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)
          else
            DEVICE_FLAG="--device /dev/dri"
          fi

          docker run -dt \
          --device=/dev/kfd $DEVICE_FLAG \
          --shm-size=16G \
          -e TRITON_WHEEL_DIR=/workspace/triton_wheels \
          --group-add $(getent group render | cut -d: -f3) \
          --group-add $(getent group video | cut -d: -f3) \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          --name triton_test \
          ${{ env.DOCKER_IMAGE }}

      - name: Setup Aiter and Triton
        run: |
          set -ex
          echo "Setting up Aiter and Triton..."
          docker exec -w /workspace triton_test ./.github/scripts/build_aiter_triton.sh

      - name: Triton Tests
        run: |
          set -exo pipefail
          echo "Running Triton Tests..."
          mkdir -p test-reports
          docker exec -w /workspace triton_test mkdir -p test-reports
          if [ -z "$TRITON_TEST" ]; then
            echo "No tests selected for this shard."
            echo '<testsuites/>' > test-reports/triton.xml
            exit 0
          fi
          # Unit tests must not autotune: surface any tuning and fail the job if it happened.
          docker exec -e TRITON_PRINT_AUTOTUNING=1 -w /workspace triton_test pytest -v -s ${TRITON_TEST} \
            --junitxml=test-reports/triton.xml 2>&1 | tee test-reports/pytest.log
          if grep -q "Triton autotuning for function" test-reports/pytest.log; then
            echo "::error::runtime autotuning ran inside unit tests"
            # Name them here as well as in the artifact: the log is long, and
            # the whole point of the gate is which kernel tuned.
            grep -n "Triton autotuning for function" test-reports/pytest.log | head -20 || true
            exit 1
          fi

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        # Not success(): a shard that trips the autotuning gate is exactly the
        # run whose log is worth keeping, and success() skips the upload for
        # it -- so the evidence only ever existed in the live Actions log,
        # which expires.
        if: ${{ !cancelled() }}
        with:
          name: triton-test-shard-${{ matrix.shard }}
          path: |
            test-reports/triton.xml
            test-reports/pytest.log
          retention-days: 7
          # A shard that died before pytest ran has neither file, which is not
          # itself an error worth failing the upload over.
          if-no-files-found: ignore

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f triton_test || true

  # MI300X runs for gfx942 changes, an explicit label, or --all.
  triton-mi300x:
    if: ${{ needs.split_triton_tests.outputs.selected_count != '0' && needs.split_triton_tests.outputs.needs_mi300x == 'true' }}
    name: Triton Tests (MI300X) / Shard ${{ matrix.shard }}
    runs-on: linux-aiter-oci-mi300x-1
    timeout-minutes: 60
    needs: [split_triton_tests, prepare_triton_wheel, check-signal, ci_config]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      DOCKER_IMAGE: ${{ needs.ci_config.outputs.pytorch_py312_image }}
      TRITON_WHEEL_ARTIFACT_NAME: ${{ needs.ci_config.outputs.triton_wheel_artifact_name }}
      TRITON_TEST: "op_tests/triton_tests/"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'

      - name: Download test shard lists
        uses: actions/download-artifact@v4
        timeout-minutes: 15
        with:
          name: triton_shards

      - name: Ensure zstd for Triton wheel cache
        if: ${{ runner.os == 'Linux' }}
        run: ./.github/scripts/ensure_zstd.sh

      - name: Restore Triton wheel cache
        id: restore_triton_wheel
        continue-on-error: true
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 30
        with:
          path: triton_wheels
          key: ${{ needs.prepare_triton_wheel.outputs.cache_key }}

      - name: Download Triton wheel artifact
        if: steps.restore_triton_wheel.outputs.cache-hit != 'true'
        id: download_triton_wheel
        uses: actions/download-artifact@v4
        timeout-minutes: 30
        continue-on-error: true
        with:
          name: ${{ env.TRITON_WHEEL_ARTIFACT_NAME }}
          path: triton_wheels

      - name: List test shard files
        run: |
          ls -l triton_shard_*.list

      - name: Docker login
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        env:
          DOCKER_USERNAME: ${{ secrets[needs.ci_config.outputs.docker_username_secret] }}
          DOCKER_PASSWORD: ${{ secrets[needs.ci_config.outputs.docker_password_secret] }}
        run: |
          for attempt in 1 2 3; do
            if echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin; then
              echo "Docker login succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Docker login attempt ${attempt} failed"
            if [ "${attempt}" != 3 ]; then
              sleep 10
            fi
          done
          echo "Docker login failed after 3 attempts, continuing anyway"
          exit 0

      - name: Export test file list for this shard as env
        id: set_shard_files
        run: |
          TRITON_TEST=$(cat triton_shard_${{ matrix.shard }}.list)
          echo "$TRITON_TEST"
          echo "TRITON_TEST=$TRITON_TEST" >> $GITHUB_ENV

      - name: Run the container
        run: |
          set -ex
          echo "Starting container: triton_test"

          if [ -f "/etc/podinfo/gha-render-devices" ]; then
            DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)
          else
            DEVICE_FLAG="--device /dev/dri"
          fi

          docker run -dt \
          --device=/dev/kfd $DEVICE_FLAG \
          --shm-size=16G \
          -e TRITON_WHEEL_DIR=/workspace/triton_wheels \
          --group-add $(getent group render | cut -d: -f3) \
          --group-add $(getent group video | cut -d: -f3) \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          --name triton_test \
          ${{ env.DOCKER_IMAGE }}

      - name: Setup Aiter and Triton
        run: |
          set -ex
          echo "Setting up Aiter and Triton..."
          docker exec -w /workspace triton_test ./.github/scripts/build_aiter_triton.sh

      - name: Triton Tests
        run: |
          set -exo pipefail
          echo "Running Triton Tests..."
          mkdir -p test-reports
          docker exec -w /workspace triton_test mkdir -p test-reports
          if [ -z "$TRITON_TEST" ]; then
            echo "No tests selected for this shard."
            echo '<testsuites/>' > test-reports/triton.xml
            exit 0
          fi
          # Unit tests must not autotune: surface any tuning and fail the job if it happened.
          docker exec -e TRITON_PRINT_AUTOTUNING=1 -w /workspace triton_test pytest -v -s ${TRITON_TEST} \
            --junitxml=test-reports/triton.xml 2>&1 | tee test-reports/pytest.log
          if grep -q "Triton autotuning for function" test-reports/pytest.log; then
            echo "::error::runtime autotuning ran inside unit tests"
            # Name them here as well as in the artifact: the log is long, and
            # the whole point of the gate is which kernel tuned.
            grep -n "Triton autotuning for function" test-reports/pytest.log | head -20 || true
            exit 1
          fi

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        # Not success(): a shard that trips the autotuning gate is exactly the
        # run whose log is worth keeping, and success() skips the upload for
        # it -- so the evidence only ever existed in the live Actions log,
        # which expires.
        if: ${{ !cancelled() }}
        with:
          name: triton-test-mi300x-shard-${{ matrix.shard }}
          path: |
            test-reports/triton.xml
            test-reports/pytest.log
          retention-days: 7
          # A shard that died before pytest ran has neither file, which is not
          # itself an error worth failing the upload over.
          if-no-files-found: ignore

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f triton_test || true

  triton-test-finish:
    name: Triton Test Results
    if: always()
    runs-on: ubuntu-latest
    needs: [split_triton_tests, triton, triton-mi300x]
    steps:
      - name: Check required Triton jobs
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          SELECTION_RESULT: ${{ needs.split_triton_tests.result }}
          SELECTED_COUNT: ${{ needs.split_triton_tests.outputs.selected_count }}
          NEEDS_MI300X: ${{ needs.split_triton_tests.outputs.needs_mi300x }}
          MI35X_RESULT: ${{ needs.triton.result }}
          MI300X_RESULT: ${{ needs.triton-mi300x.result }}
        run: |
          set -euo pipefail
          if [ "$PR_DRAFT" = true ]; then
            echo "Draft PR; tests are deferred until ready for review."
            exit 0
          fi
          test "$SELECTION_RESULT" = success
          if [ "$SELECTED_COUNT" = 0 ]; then
            echo "No Triton/Gluon tests required for this change."
            exit 0
          fi
          test "$MI35X_RESULT" = success
          if [ "$NEEDS_MI300X" = true ]; then
            test "$MI300X_RESULT" = success
          fi
