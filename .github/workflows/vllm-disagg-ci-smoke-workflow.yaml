name: vLLM disagg CI smoke workflow

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [main]
  schedule:
    # Nightly vLLM DI smoke run, 2:30 AM Beijing Time (UTC+8).
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      disagg_scripts_stage:
        description: "Shared path visible to Spur login and compute nodes"
        required: false
        type: string
        default: "/data/xinhuang/vllm-disagg-logs/"
      spur_node_pool:
        description: "Comma-separated Spur node pool used to select idle nodes for each smoke job"
        required: false
        type: string
        default: "ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-5,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-6,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-7,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-8,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-13,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-15,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-16"
      image:
        description: "vLLM ROCm image (default: the nightly tag, pinned to its digest for the whole run)"
        required: false
        type: string
        default: "vllm/vllm-openai-rocm:nightly"
      vllm_ref:
        description: "vLLM branch, tag or SHA for the .buildkite/amd-disagg harness and case list (empty = VLLM_BASELINE_SHA)"
        required: false
        type: string
        default: ""
      models:
        description: "Comma-separated MODEL_NAME filter for a quick subset run (empty = all models)"
        required: false
        type: string
        default: ""
      topologies:
        description: "Comma-separated topology filter, e.g. 2P1D-TP8,2P2D-EP16 (empty = all topologies)"
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VLLM_REPOSITORY_URL: https://github.com/vllm-project/vllm.git
  # vLLM main as of 2026-10-27. The harness under .buildkite/amd-disagg and the
  # case list are taken from this tree and run against the nightly image below,
  # so bump it when the nightly moves past a harness change. A non-empty
  # vllm_ref input overrides it for a single run.
  VLLM_BASELINE_SHA: 7fe793a5d5b75a30386e0e182708da6fc5487954
  VLLM_REF_INPUT: ${{ inputs.vllm_ref || '' }}
  # :nightly moves daily. build_aiter_wheel pins it to a digest that the wheel
  # build and every case then use, so a nightly published mid-run cannot mix two
  # images. Pass a digest via the image input to rerun an exact image.
  BASE_IMAGE: ${{ inputs.image || 'vllm/vllm-openai-rocm:nightly' }}
  # vllm/vllm-router publishes no release tags, only nightlies, so this tracks
  # nightly rather than pinning a digest that no tag points at any more. As of
  # 2026-09-16 it resolves to
  # sha256:906b6d59b6bbc8adc744012704d3464e58abe47e99d8b1647e1029a4793484e5.
  # Use a dated tag (e.g. nightly-20260916-92d0bb9) to pin a run exactly.
  VLLM_ROUTER_IMAGE: vllm/vllm-router:nightly
  DISAGG_SCRIPTS_STAGE: ${{ inputs.disagg_scripts_stage || '/data/xinhuang/vllm-disagg-logs/' }}
  SPUR_NODE_POOL: ${{ inputs.spur_node_pool || 'ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-5,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-6,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-7,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-8,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-13,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-15,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-16' }}
  # Every case shares SPUR_NODE_POOL, so 3- and 4-node cases queue behind each
  # other in Spur. Allow up to 3 h queued instead of the harness's 30-minute
  # default. SLURM_TIME_LIMIT is both the job walltime and the harness poller's
  # deadline from submission, so it has to cover the wait plus the run.
  PENDING_MAX_S: "10800"
  SLURM_TIME_LIMIT: "06:00:00"
  # Optional workflow_dispatch filters for a quick subset run. Empty on PR and
  # cron events, which always exercise the full matrix.
  CASE_MODEL_FILTER: ${{ inputs.models || '' }}
  CASE_TOPOLOGY_FILTER: ${{ inputs.topologies || '' }}
  AITER_GPU_ARCHS: gfx950
  AITER_BUILD_MAX_JOBS: "64"
  AITER_WHEEL_ARTIFACT_NAME: aiter-vllm-disagg-wheel-${{ github.run_id }}

jobs:
  ci_config:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'ci:vllm-di'))
    uses: ./.github/workflows/ci-config.yaml

  build_aiter_wheel:
    name: Build gfx950 Aiter overlay wheels
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'ci:vllm-di'))
    needs: ci_config
    runs-on: build-only-aiter
    outputs:
      image_ref: ${{ steps.base_image.outputs.image_ref }}
    steps:
      - name: Checkout AITER
        uses: actions/checkout@v4

      - name: Sync submodules
        run: |
          set -euo pipefail
          git submodule sync
          git submodule update --init --recursive --depth 1 --jobs 4

      - name: Docker login
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        env:
          DOCKER_USERNAME: ${{ secrets[needs.ci_config.outputs.docker_username_secret] }}
          DOCKER_PASSWORD: ${{ secrets[needs.ci_config.outputs.docker_password_secret] }}
        run: |
          for attempt in 1 2 3; do
            if echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin; then
              echo "Docker login succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Docker login attempt ${attempt} failed"
            if [ "${attempt}" != 3 ]; then
              sleep 10
            fi
          done
          echo "Docker login failed after 3 attempts, continuing anyway"
          exit 0

      - name: Pin the vLLM image to a digest
        id: base_image
        run: |
          set -euo pipefail
          bash .github/scripts/docker_pull_with_retry.sh "${BASE_IMAGE}"
          if [[ "${BASE_IMAGE}" == *@sha256:* ]]; then
            image_ref="${BASE_IMAGE}"
          else
            repo="${BASE_IMAGE}"
            # Strip a trailing :tag, but not a registry :port.
            if [[ "${repo##*/}" == *:* ]]; then
              repo="${repo%:*}"
            fi
            image_ref="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${BASE_IMAGE}" \
              | grep -m1 -F "${repo}@sha256:" || true)"
          fi
          if [[ -z "${image_ref}" ]]; then
            echo "Could not resolve a digest for ${BASE_IMAGE}" >&2
            exit 1
          fi
          vllm_version="$(docker run --rm --entrypoint python3 "${image_ref}" \
            -c 'from importlib.metadata import version; print(version("vllm"))')"
          echo "Pinned ${BASE_IMAGE} to ${image_ref} (vllm ${vllm_version})"
          {
            echo "image_ref=${image_ref}"
            echo "vllm_version=${vllm_version}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### vLLM image"
            echo
            echo "- Requested: \`${BASE_IMAGE}\`"
            echo "- Pinned: \`${image_ref}\`"
            echo "- vllm: \`${vllm_version}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build AITER wheel in the vLLM nightly image
        env:
          BASE_IMAGE: ${{ steps.base_image.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker run --rm \
            --network=host \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e AITER_USE_SYSTEM_TRITON=1 \
            -e GPU_ARCHS="${AITER_GPU_ARCHS}" \
            -e PREBUILD_KERNELS=0 \
            -e MAX_JOBS="${AITER_BUILD_MAX_JOBS}" \
            --entrypoint /bin/bash \
            "${BASE_IMAGE}" \
            -lc '
              set -euo pipefail
              git config --global --add safe.directory /workspace
              shopt -s nullglob
              rm -rf dist build aiter_meta ./*.egg-info
              rm -f .aiter-build.log
              python3 -c "from importlib.metadata import version; import flydsl; flydsl_version = version(\"flydsl\"); print(f\"Unmodified runtime dependency: flydsl={flydsl_version} at {flydsl.__file__}\")"
              pip uninstall -y aiter amd-aiter || true
              pip config set global.default-timeout 60
              pip config set global.retries 10
              pip install -r requirements.txt
              pip install --upgrade pandas pyzmq einops numpy==1.26.2
              pip install --upgrade "pybind11>=3.0.1"
              pip install --upgrade "ninja>=1.11.1"
              pip install --upgrade "setuptools_scm[toml]>=6.2" wheel packaging psutil
              pip install tabulate
              flydsl_version="$(python3 -c "from importlib.metadata import version; print(version(\"flydsl\"))")"
              echo "Packaging runtime dependency flydsl==${flydsl_version}"
              python3 -m pip download \
                --no-deps \
                --only-binary=:all: \
                --dest dist \
                "flydsl==${flydsl_version}"
              echo "Prebuilding the gfx950 CKTile A8W8 blockscale module"
              python3 .github/scripts/prebuild_vllm_disagg_cktile.py
              echo "Building AITER wheel for GPU_ARCHS=${GPU_ARCHS}, PREBUILD_KERNELS=${PREBUILD_KERNELS}, MAX_JOBS=${MAX_JOBS}"
              python setup.py bdist_wheel 2>&1 | tee .aiter-build.log
              ls -lh dist/*.whl
              aiter_wheels=(dist/amd_aiter-*.whl)
              flydsl_wheels=(dist/flydsl-*.whl)
              if (( ${#aiter_wheels[@]} != 1 )); then
                echo "Expected exactly one amd_aiter wheel, found ${#aiter_wheels[@]}" >&2
                exit 1
              fi
              if (( ${#flydsl_wheels[@]} != 1 )); then
                echo "Expected exactly one flydsl wheel, found ${#flydsl_wheels[@]}" >&2
                exit 1
              fi
              python3 -c "import sys, zipfile; wheel = sys.argv[1]; archive = zipfile.ZipFile(wheel); names = archive.namelist(); prefix = \"aiter_meta/hsa/\"; arches = {name[len(prefix):].split(\"/\", 1)[0] for name in names if name.startswith(prefix) and \"/\" in name[len(prefix):]}; print(f\"AITER wheel entries: {len(names)}; packaged HSA arches: {sorted(arches)}\"); assert archive.testzip() is None, \"corrupt wheel member\"; assert \"aiter/__init__.py\" in names; assert \"aiter/jit/module_gemm_a8w8_blockscale_cktile.so\" in names, \"missing targeted CKTile prebuild\"; assert any(name.startswith(\"aiter_meta/hsa/gfx950/\") and name.endswith(\".co\") for name in names), \"missing gfx950 code objects\"" "${aiter_wheels[0]}"
              python3 -c "import sys, zipfile; wheel = sys.argv[1]; archive = zipfile.ZipFile(wheel); names = archive.namelist(); print(f\"FlyDSL wheel entries: {len(names)}\"); assert archive.testzip() is None, \"corrupt wheel member\"; assert \"flydsl/__init__.py\" in names, \"missing flydsl package\"" "${flydsl_wheels[0]}"
            '

      - name: Upload AITER overlay wheels
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AITER_WHEEL_ARTIFACT_NAME }}
          path: |
            dist/*.whl
            .aiter-build.log
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  select_vllm_cases:
    name: Select upstream vLLM cases
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'ci:vllm-di'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      vllm_sha: ${{ steps.vllm_ref.outputs.sha }}
    steps:
      - name: Resolve the vLLM harness commit
        id: vllm_ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="${VLLM_REF_INPUT:-${VLLM_BASELINE_SHA}}"
          # Every matrix job checks out this exact SHA, so a branch or tag input
          # cannot move between them.
          sha="$(gh api "repos/vllm-project/vllm/commits/${ref}" --jq .sha)"
          echo "vLLM harness: ${ref} -> ${sha}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout the vLLM harness
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: ${{ steps.vllm_ref.outputs.sha }}
          fetch-depth: 1
          path: vllm

      - name: Select vLLM-router cases
        id: select
        env:
          VLLM_SHA: ${{ steps.vllm_ref.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from collections import Counter
          from pathlib import Path

          pipeline = Path("vllm/.buildkite/amd-disagg/pipeline-disagg.yaml")
          # Node count per P/D shape, and (topology suffix, WIDE_EP_MODE) per
          # parallelism, as they appear in the upstream step labels.
          shape_nodes = {"1P1D": 2, "2P1D": 3, "2P2D": 4}
          parallel_modes = {
              "TP8": ("TP8", "0"),
              "EP8/DP8": ("EP8", "1"),
              "EP16/DP16": ("EP16", "1"),
          }
          required = {"1P1D-TP8", "2P1D-TP8", "2P2D-TP8", "1P1D-EP8", "2P2D-EP16"}
          label_re = re.compile(r"-PD-(\d+P\d+D)-([A-Z]+\d+(?:/DP\d+)?)-")
          cases = []
          skipped = []
          pending = None  # vLLM-router label still waiting for its command line

          for line in pipeline.read_text(encoding="utf-8").splitlines():
              label_match = re.match(r'\s*-\s+label:\s+["\'](.+)["\']\s*$', line)
              if label_match:
                  if pending:
                      raise SystemExit(f"No command found for {pending!r} in {pipeline}")
                  label = label_match.group(1)
                  pending = label if label.endswith("-vllm-router") else None
                  continue

              command_match = re.match(
                  r"\s*-\s+((?:IMAGE=\S+\s+)?MODEL_NAME=.*run-slurm-disagg-test\.sh)\s*$",
                  line,
              )
              if not command_match or not pending:
                  continue
              label, pending = pending, None

              topology_match = label_re.search(label)
              shape, parallel = topology_match.groups() if topology_match else (None, None)
              if shape not in shape_nodes or parallel not in parallel_modes:
                  skipped.append(label)
                  continue
              suffix, wide_ep = parallel_modes[parallel]
              topology = f"{shape}-{suffix}"

              # The run step passes the pinned image as IMAGE, so an inline
              # IMAGE= would override it.
              command = re.sub(r"^IMAGE=\S+\s+", "", command_match.group(1))
              fields = dict(re.findall(r"(?:^|\s)([A-Za-z_]+)=(\S+)", command))
              model = fields.get("MODEL_NAME")
              nodes = fields.get("NODES", "")
              if not model or not nodes.isdigit():
                  raise SystemExit(f"{label!r}: no MODEL_NAME/NODES in {command!r}")
              if int(nodes) != shape_nodes[shape] or fields.get("WIDE_EP_MODE", "0") != wide_ep:
                  raise SystemExit(
                      f"{label!r}: NODES={nodes} WIDE_EP_MODE={fields.get('WIDE_EP_MODE')} "
                      f"do not match {topology}"
                  )

              slug = re.sub(r"[^A-Za-z0-9_.-]+", "-", f"{model}-{topology}")
              cases.append(
                  {
                      "case_name": label,
                      "case_slug": slug,
                      "command": command,
                      "model_name": model,
                      "topology": topology,
                      "nodes": int(nodes),
                  }
              )
          if pending:
              raise SystemExit(f"No command found for {pending!r} in {pipeline}")

          # Upstream ships TP8 only as 1P1D and 2P2D. Derive the 2P1D shape from
          # each 2P2D TP8 case so the coverage lives here rather than waiting on a
          # vLLM pipeline change; the harness patches #SBATCH --nodes at submit
          # time, so a 3-node topology needs nothing extra from the job script.
          existing = {(case["model_name"], case["topology"]) for case in cases}
          derived = []
          for case in cases:
              if case["topology"] != "2P2D-TP8":
                  continue
              if (case["model_name"], "2P1D-TP8") in existing:
                  continue
              command, subs = re.subn(
                  r"(?<=\s)yD=2 NODES=4(?=\s)", "yD=1 NODES=3", case["command"]
              )
              if subs != 1:
                  raise SystemExit(
                      "Could not derive a 2P1D command from "
                      f"{case['case_name']!r}: expected one 'yD=2 NODES=4' to "
                      f"rewrite, found {subs}"
                  )
              case_name = case["case_name"].replace("-PD-2P2D-", "-PD-2P1D-")
              if case_name == case["case_name"]:
                  raise SystemExit(
                      f"Could not relabel {case['case_name']!r} as 2P1D"
                  )
              derived.append(
                  {
                      "case_name": case_name,
                      "case_slug": re.sub(
                          r"[^A-Za-z0-9_.-]+", "-", f"{case['model_name']}-2P1D-TP8"
                      ),
                      "command": command,
                      "model_name": case["model_name"],
                      "topology": "2P1D-TP8",
                      "nodes": 3,
                  }
              )
          cases.extend(derived)

          keys = Counter((case["model_name"], case["topology"]) for case in cases)
          duplicates = sorted(key for key, count in keys.items() if count > 1)
          if duplicates:
              raise SystemExit(f"Duplicate vLLM-router cases in {pipeline}: {duplicates}")
          per_topology = Counter(case["topology"] for case in cases)
          missing = sorted(required - set(per_topology))
          if missing:
              raise SystemExit(
                  f"No vLLM-router cases for {missing} in {pipeline}; "
                  f"got {dict(per_topology)}"
              )

          # workflow_dispatch may narrow the matrix for a quick subset run. PR and
          # cron events leave both filters empty and run everything.
          def _requested(raw):
              return [item.strip() for item in raw.split(",") if item.strip()]

          model_filter = _requested(os.environ.get("CASE_MODEL_FILTER", ""))
          topology_filter = _requested(os.environ.get("CASE_TOPOLOGY_FILTER", ""))
          for name, requested, available in (
              ("models", model_filter, {case["model_name"] for case in cases}),
              ("topologies", topology_filter, {case["topology"] for case in cases}),
          ):
              unknown = sorted(set(requested) - available)
              if unknown:
                  raise SystemExit(
                      f"Unknown {name} requested: {unknown}; "
                      f"available: {sorted(available)}"
                  )
          if model_filter:
              cases = [c for c in cases if c["model_name"] in model_filter]
          if topology_filter:
              cases = [c for c in cases if c["topology"] in topology_filter]
          if not cases:
              raise SystemExit(
                  "No cases left after filtering "
                  f"models={model_filter} topologies={topology_filter}"
              )

          matrix = json.dumps({"include": cases}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"matrix={matrix}", file=output)

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as output:
              print("### Selected upstream vLLM cases\n", file=output)
              if model_filter or topology_filter:
                  print(
                      f"Subset run: {len(cases)} case(s) after filtering "
                      f"models={model_filter or 'all'} "
                      f"topologies={topology_filter or 'all'}.\n",
                      file=output,
                  )
              else:
                  print(
                      f"Selected all {len(cases)} vLLM-router accuracy cases.\n",
                      file=output,
                  )
              print(f"vLLM harness `{os.environ['VLLM_SHA']}`.\n", file=output)
              selected_per_topology = Counter(case["topology"] for case in cases)
              print("| Topology | Cases |", file=output)
              print("|---|---:|", file=output)
              for topology, count in sorted(selected_per_topology.items()):
                  print(f"| `{topology}` | {count} |", file=output)
              print(file=output)
              if skipped:
                  print(
                      "Skipped upstream vLLM-router steps with an unrecognized "
                      f"topology: {', '.join(f'`{label}`' for label in skipped)}\n",
                      file=output,
                  )
              print("| Case | Nodes | Upstream command |", file=output)
              print("|---|---:|---|", file=output)
              for case in cases:
                  print(
                      f'| `{case["case_name"]}` | {case["nodes"]} | '
                      f'`{case["command"]}` |',
                      file=output,
                  )
          PY

  vllm-disagg-smoke:
    name: ${{ matrix.case_name }}
    needs: [build_aiter_wheel, select_vllm_cases]
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'ci:vllm-di'))
    runs-on: [self-hosted, aiter-di-ci-spur-login-vllm]
    timeout-minutes: 600
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.select_vllm_cases.outputs.matrix) }}
    env:
      BASE_IMAGE: ${{ needs.build_aiter_wheel.outputs.image_ref }}
      VLLM_SHA: ${{ needs.select_vllm_cases.outputs.vllm_sha }}
      HF_TOKEN: ${{ secrets.HF_TOKEN_TEST }}
      UPSTREAM_CASE_COMMAND: ${{ matrix.command }}
      CASE_NAME: ${{ matrix.case_name }}
      CASE_SLUG: ${{ matrix.case_slug }}
      MODEL_NAME: ${{ matrix.model_name }}
      TOPOLOGY: ${{ matrix.topology }}
      NODES: ${{ matrix.nodes }}
    steps:
      - name: Download AITER overlay wheels
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.AITER_WHEEL_ARTIFACT_NAME }}
          path: aiter_wheels/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.case_slug }}

      - name: Show runner and Slurm state
        run: |
          set -euo pipefail
          hostname
          whoami
          pwd
          command -v git
          command -v sbatch
          command -v scontrol
          command -v scancel
          command -v sacct || true
          command -v spur && spur --help | head -120 || true

      - name: Checkout the vLLM harness
        run: |
          set -euo pipefail
          rm -rf vllm
          git init vllm
          cd vllm
          git remote add origin "${VLLM_REPOSITORY_URL}"
          git fetch --depth=1 origin "${VLLM_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${VLLM_SHA}"

      - name: Add offline AITER wheel overlay to the upstream case
        run: |
          set -euo pipefail
          artifact_dir="${GITHUB_WORKSPACE}/aiter_wheels/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CASE_SLUG}"
          mapfile -d '' aiter_wheels < <(find "${artifact_dir}" -type f -name 'amd_aiter-*.whl' -print0)
          mapfile -d '' flydsl_wheels < <(find "${artifact_dir}" -type f -name 'flydsl-*.whl' -print0)
          if [[ "${#aiter_wheels[@]}" -ne 1 || "${#flydsl_wheels[@]}" -ne 1 ]]; then
            echo "Expected one amd_aiter wheel and one flydsl wheel in ${artifact_dir}; found AITER=${#aiter_wheels[@]} FlyDSL=${#flydsl_wheels[@]}" >&2
            find "${artifact_dir}" -type f -printf '%P\n' >&2 || true
            exit 1
          fi

          disagg_dir="${GITHUB_WORKSPACE}/vllm/.buildkite/amd-disagg"
          test -d "${disagg_dir}"
          rm -rf "${disagg_dir}/aiter_overlay"
          mkdir -p "${disagg_dir}/aiter_overlay"
          # Extract AITER and its matching FlyDSL dependency on the login runner
          # so compute nodes never invoke pip or PyPI.
          python3 -m zipfile -e "${aiter_wheels[0]}" "${disagg_dir}/aiter_overlay"
          python3 -m zipfile -e "${flydsl_wheels[0]}" "${disagg_dir}/aiter_overlay"
          test -f "${disagg_dir}/aiter_overlay/aiter/__init__.py"
          test -f "${disagg_dir}/aiter_overlay/flydsl/__init__.py"

          cat > "${disagg_dir}/aiter_cluster_env.sh" <<'SH'
          #!/usr/bin/env bash
          overlay_root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/aiter_overlay"
          source "$(dirname "${BASH_SOURCE[0]}")/cluster.sh"
          export GPU_ARCHS=gfx950
          export PYTHONPATH="${overlay_root}${PYTHONPATH:+:${PYTHONPATH}}"
          python3 - "${overlay_root}" <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import sys
          import aiter
          import flydsl

          root = Path(sys.argv[1]).resolve()
          loaded = Path(aiter.__file__).resolve()
          flydsl_loaded = Path(flydsl.__file__).resolve()
          print(
              f"[aiter-overlay] loaded {loaded}; "
              f"flydsl={version('flydsl')} at {flydsl_loaded}"
          )
          if root not in loaded.parents:
              raise SystemExit(f"AITER was not loaded from {root}")
          if root not in flydsl_loaded.parents:
              raise SystemExit(f"FlyDSL was not loaded from {root}")
          PY
          SH
          chmod +x "${disagg_dir}/aiter_cluster_env.sh"

          du -sh "${disagg_dir}/aiter_overlay"
          grep -n "aiter-overlay" "${disagg_dir}/aiter_cluster_env.sh"
          grep -n 'CLUSTER_ENV_IN=' "${disagg_dir}/run_xPyD_disagg.slurm"
          grep -n 'export CLUSTER_ENV=' "${disagg_dir}/run_xPyD_disagg.slurm"
          git -C "${GITHUB_WORKSPACE}/vllm" diff --exit-code -- \
            .buildkite/amd-disagg/vllm_disagg.sh \
            .buildkite/amd-disagg/run_xPyD_disagg.slurm

      - name: Configure Spur node pool for topology
        run: |
          set -euo pipefail
          if [[ "${NODES}" != "2" && "${NODES}" != "3" && "${NODES}" != "4" ]]; then
            echo "Unsupported node count: ${NODES}" >&2
            exit 1
          fi

          IFS=',' read -r -a pool_nodes <<< "${SPUR_NODE_POOL}"
          if (( ${#pool_nodes[@]} < NODES )); then
            echo "Spur node pool has ${#pool_nodes[@]} nodes, but ${NODES} are required" >&2
            exit 1
          fi

          declare -A allowed=()
          for node in "${pool_nodes[@]}"; do
            allowed["${node}"]=1
          done

          mapfile -t cluster_nodes < <(sinfo -N -h -o '%N' | sort -Vu)
          declare -A present=()
          excluded_nodes=()
          for node in "${cluster_nodes[@]}"; do
            present["${node}"]=1
            if [[ -z "${allowed[${node}]+x}" ]]; then
              excluded_nodes+=("${node}")
            fi
          done
          for node in "${pool_nodes[@]}"; do
            if [[ -z "${present[${node}]+x}" ]]; then
              echo "Configured Spur node is not present in sinfo: ${node}" >&2
              exit 1
            fi
          done

          exclude="$(IFS=,; echo "${excluded_nodes[*]}")"
          echo "SPUR_NODE_EXCLUDE=${exclude}" >> "${GITHUB_ENV}"
          echo "Configured upstream case ${CASE_NAME}: nodes=${NODES}, pool=${SPUR_NODE_POOL}"

      - name: Show vLLM disagg inputs
        run: |
          set -euo pipefail
          {
            echo "### vLLM disagg smoke input"
            echo
            echo "- vLLM repository: \`${VLLM_REPOSITORY_URL}\`"
            echo "- vLLM harness SHA: \`${VLLM_SHA}\`"
            echo "- AITER gfx950 + FlyDSL wheel overlay: \`PREBUILD_KERNELS=0 + targeted CKTile prebuild (offline, no compute-node pip)\`"
            echo "- AITER SHA: \`${GITHUB_SHA}\`"
            echo "- Upstream case: \`${CASE_NAME}\`"
            echo "- Upstream command: \`${UPSTREAM_CASE_COMMAND}\`"
            echo "- IMAGE: \`${BASE_IMAGE}\`"
            echo "- VLLM_ROUTER_IMAGE: \`${VLLM_ROUTER_IMAGE}\`"
            echo "- SPUR_NODE_POOL: \`${SPUR_NODE_POOL}\`"
            echo "- SPUR_NODE_EXCLUDE: \`${SPUR_NODE_EXCLUDE}\`"
            echo "- PENDING_MAX_S / SLURM_TIME_LIMIT: \`${PENDING_MAX_S}\` / \`${SLURM_TIME_LIMIT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run upstream vLLM disagg case
        run: |
          set -euo pipefail
          disagg_dir="${GITHUB_WORKSPACE}/vllm/.buildkite/amd-disagg"
          cd "${disagg_dir}"

          script="run-slurm-disagg-test.sh"
          job_script="run_xPyD_disagg.slurm"
          test -f "${script}"
          test -f "${job_script}"

          # Restrict scheduling to the AITER MI350 pool and let Slurm choose
          # any currently available nodes. This allows independent matrix jobs
          # to run concurrently without racing on a preselected nodelist.
          if [[ -n "${SPUR_NODE_EXCLUDE}" ]] && ! grep -q '^#SBATCH --exclude=' "${job_script}"; then
            sed -i "/^#SBATCH --exclusive/a #SBATCH --exclude=${SPUR_NODE_EXCLUDE}" "${job_script}"
            echo "Restricted Slurm scheduling to SPUR_NODE_POOL=${SPUR_NODE_POOL}"
          fi

          submit_log="${GITHUB_WORKSPACE}/slurm-submit.txt"
          sacct_log="${GITHUB_WORKSPACE}/slurm-sacct.txt"
          log_root="${DISAGG_SCRIPTS_STAGE%/}"
          mkdir -p "${log_root}"
          # Self-hosted runners keep their workspace between jobs. Clear stale
          # submit/accounting files before the live-log thread looks for a job ID.
          rm -f "${submit_log}" "${sacct_log}"

          cd "${GITHUB_WORKSPACE}/vllm"
          echo "Running vLLM case at ${VLLM_SHA}: ${CASE_NAME}"
          echo "${UPSTREAM_CASE_COMMAND}"

          stream_disagg_logs() {
            local submit_log="$1"
            local done_file="$2"
            local log_root="$3"
            local job_id=""
            local job_log=""
            local role_dir=""
            local logfile=""
            local tail_pid=""
            local -A followed=()
            local -a tail_pids=()

            while [[ ! -f "${done_file}" ]]; do
              job_id="$(grep -oE 'Submitted batch job[[:space:]]+[0-9]+' "${submit_log}" 2>/dev/null | grep -oE '[0-9]+' | tail -1 || true)"
              [[ -n "${job_id}" ]] && break
              sleep 1
            done

            if [[ -z "${job_id}" ]]; then
              job_id="$(grep -oE 'Submitted batch job[[:space:]]+[0-9]+' "${submit_log}" 2>/dev/null | grep -oE '[0-9]+' | tail -1 || true)"
            fi
            if [[ -z "${job_id}" ]]; then
              echo "[live-log] no Slurm job id found; nothing to stream"
              return 0
            fi

            job_log="${log_root}/vllm-disagg-pd-${job_id}.log"
            role_dir="${log_root}/${job_id}"
            echo "[live-log] Slurm job ${job_id}; watching ${job_log} and ${role_dir}/*.log"

            while [[ ! -f "${done_file}" ]]; do
              while IFS= read -r -d '' logfile; do
                if [[ -n "${followed[${logfile}]+x}" ]]; then
                  continue
                fi
                followed["${logfile}"]=1
                if [[ "$(basename "${logfile}")" == accuracy_*.log ]]; then
                  echo "[accuracy-live] following ${logfile}"
                else
                  echo "[live-log] following ${logfile}"
                fi
                tail -n +1 -F -- "${logfile}" &
                tail_pids+=("$!")
              done < <(
                if [[ -f "${job_log}" ]]; then
                  printf '%s\0' "${job_log}"
                fi
                if [[ -d "${role_dir}" ]]; then
                  find "${role_dir}" -maxdepth 1 -type f -name '*.log' -print0 2>/dev/null
                fi
              )
              sleep 5
            done

            # Give existing followers a moment to flush terminal diagnostics,
            # then print any log that appeared between the final scan and exit.
            sleep 2
            while IFS= read -r -d '' logfile; do
              if [[ -z "${followed[${logfile}]+x}" ]]; then
                if [[ "$(basename "${logfile}")" == accuracy_*.log ]]; then
                  echo "[accuracy-live] final ${logfile}"
                else
                  echo "[live-log] final ${logfile}"
                fi
                tail -n +1 -- "${logfile}" || true
              fi
            done < <(
              if [[ -f "${job_log}" ]]; then
                printf '%s\0' "${job_log}"
              fi
              if [[ -d "${role_dir}" ]]; then
                find "${role_dir}" -maxdepth 1 -type f -name '*.log' -print0 2>/dev/null
              fi
            )

            for tail_pid in "${tail_pids[@]}"; do
              kill "${tail_pid}" 2>/dev/null || true
            done
            for tail_pid in "${tail_pids[@]}"; do
              wait "${tail_pid}" 2>/dev/null || true
            done
            echo "[live-log] stopped streaming Slurm job ${job_id}"
          }

          stream_done="${GITHUB_WORKSPACE}/.vllm-disagg-stream-done"
          rm -f "${stream_done}"
          stream_disagg_logs "${submit_log}" "${stream_done}" "${log_root}" &
          stream_pid=$!

          set +e
          env \
            BUILDKITE_COMMIT="${VLLM_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CASE_SLUG}" \
            IMAGE="${BASE_IMAGE}" \
            VLLM_ROUTER_IMAGE="${VLLM_ROUTER_IMAGE}" \
            PENDING_MAX_S="${PENDING_MAX_S}" \
            SLURM_TIME_LIMIT="${SLURM_TIME_LIMIT}" \
            DISAGG_SCRIPTS_STAGE="${DISAGG_SCRIPTS_STAGE}" \
            LOG_ROOT="${log_root}" \
            CLUSTER_ENV_IN="/vllm-workspace/.buildkite/amd-disagg/aiter_cluster_env.sh" \
            bash -lc "${UPSTREAM_CASE_COMMAND}" 2>&1 | tee "${submit_log}"
          wrapper_rc=${PIPESTATUS[0]}
          touch "${stream_done}"
          wait "${stream_pid}" || true
          set -e

          job_id="$(grep -oE 'Submitted batch job[[:space:]]+[0-9]+' "${submit_log}" | grep -oE '[0-9]+' | tail -1 || true)"
          if [[ -n "${job_id}" ]]; then
            echo "SLURM_JOB_ID=${job_id}" >> "${GITHUB_ENV}"
            role_dir="${log_root}/${job_id}"
            job_log="${log_root}/vllm-disagg-pd-${job_id}.log"
            mapfile -d '' accuracy_logs < <(
              find "${role_dir}" -maxdepth 1 -type f -name 'accuracy_*.log' -print0 2>/dev/null
            )
            if (( ${#accuracy_logs[@]} == 0 )); then
              echo "[accuracy-result] no accuracy log found under ${role_dir}"
            else
              for accuracy_log in "${accuracy_logs[@]}"; do
                echo "::group::Accuracy result: ${accuracy_log}"
                grep -ahE 'exact_match|stderr' "${accuracy_log}" | tail -20 || true
                echo "::endgroup::"
              done
            fi
            echo "::group::Accuracy verdict: Slurm job ${job_id}"
            grep -ahE '\[vllm_disagg\] (PASS|FAIL|VERDICT):|exact_match' "${job_log}" | tail -20 || true
            echo "::endgroup::"
            if command -v sacct >/dev/null 2>&1; then
              sacct -j "${job_id}" --format=JobID,State,ExitCode,Elapsed,NodeList \
                | tee "${sacct_log}" || true
            fi
          else
            echo "Could not parse Slurm job id from ${submit_log}" >&2
            wrapper_rc=1
          fi

          exit "${wrapper_rc}"

      - name: Collect Slurm result
        if: always()
        run: |
          set -euo pipefail
          rm -f vllm-disagg-job.log
          job_log="${DISAGG_SCRIPTS_STAGE%/}/vllm-disagg-pd-${SLURM_JOB_ID:-}.log"
          if [[ -f "${job_log}" ]]; then
            cp -f "${job_log}" vllm-disagg-job.log
          else
            echo "No job log at ${job_log}; the workload may not have launched."
          fi

          role_dir=""
          if [[ -n "${SLURM_JOB_ID:-}" ]]; then
            role_dir="${DISAGG_SCRIPTS_STAGE%/}/${SLURM_JOB_ID}"
          fi
          if [[ -n "${role_dir}" && -d "${role_dir}" ]]; then
            role_artifact_dir="vllm-disagg-role-logs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            mkdir -p "${role_artifact_dir}"
            find "${role_dir}" -maxdepth 1 -type f -name '*.log' \
              -exec cp -f --no-preserve=mode,ownership,timestamps {} "${role_artifact_dir}/" \;
            echo "Copied top-level role logs from ${role_dir}."
          else
            echo "No role-log directory for Slurm job ${SLURM_JOB_ID:-unknown}."
          fi

      - name: Publish case accuracy summary
        if: always()
        run: |
          set -euo pipefail
          accuracy_line=""
          if [[ -f vllm-disagg-job.log ]]; then
            accuracy_line="$(
              grep -ahE '\[vllm_disagg\] (PASS|FAIL): exact_match=' \
                vllm-disagg-job.log | tail -1 || true
            )"
          fi

          if [[ -z "${accuracy_line}" ]]; then
            {
              echo "### ${CASE_NAME} accuracy"
              echo
              echo "> No exact_match result was found for this case."
              echo
              echo "- Model: \`${MODEL_NAME}\`"
              echo "- Topology: \`${TOPOLOGY}\`"
              echo "- Slurm job: \`${SLURM_JOB_ID:-unknown}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "No exact_match result found in vllm-disagg-job.log." >&2
            exit 1
          fi

          result="$(sed -E 's/.*\] (PASS|FAIL):.*/\1/' <<< "${accuracy_line}")"
          exact_match="$(sed -E 's/.*exact_match=([^[:space:]]+).*/\1/' <<< "${accuracy_line}")"
          threshold="$(sed -E 's/.*threshold=([^[:space:]]+).*/\1/' <<< "${accuracy_line}")"
          {
            echo "### ${CASE_NAME} accuracy"
            echo
            echo "| Field | Result |"
            echo "| --- | --- |"
            echo "| Model | \`${MODEL_NAME}\` |"
            echo "| Topology | \`${TOPOLOGY}\` |"
            echo "| exact_match | \`${exact_match}\` |"
            echo "| Threshold | \`${threshold}\` |"
            echo "| Verdict | **${result}** |"
            echo "| Slurm job | \`${SLURM_JOB_ID:-unknown}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${result}" != "PASS" ]]; then
            exit 1
          fi

      - name: Upload vLLM disagg smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vllm-disagg-${{ matrix.case_slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            slurm-submit.txt
            slurm-sacct.txt
            vllm-disagg-job.log
            vllm-disagg-role-logs-${{ github.run_id }}-${{ github.run_attempt }}/
