name: vLLM disagg CI smoke workflow

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [main]
  schedule:
    # Nightly vLLM DI smoke run, 2:30 AM Beijing Time (UTC+8).
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      disagg_scripts_stage:
        description: "Shared path visible to Spur login and compute nodes"
        required: false
        type: string
        default: "/data/xinhuang/vllm-disagg-logs/"
      spur_node_pool:
        description: "Comma-separated Spur node pool used to select idle nodes for each smoke job"
        required: false
        type: string
        default: "ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-5,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-6,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-7,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-8,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-13,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-15,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-16"
      image:
        description: "Pinned official vLLM ROCm image used by upstream DI build #17"
        required: false
        type: string
        default: "vllm/vllm-openai-rocm@sha256:0f3fcd5cc4cb4642f85cf6c22e105ab6125730d98d1b72e16b2987721364a50e"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VLLM_REPOSITORY_URL: https://github.com/vllm-project/vllm.git
  # Exact source tree used by the passing vLLM AMD DI Buildkite build #17.
  VLLM_BASELINE_SHA: a42850c85f815ab3123a541bc92fb9b35892335e
  # Image used by the passing vLLM AMD DI Buildkite build #17 on 2026-07-30.
  BASE_IMAGE: ${{ inputs.image || 'vllm/vllm-openai-rocm@sha256:0f3fcd5cc4cb4642f85cf6c22e105ab6125730d98d1b72e16b2987721364a50e' }}
  VLLM_ROUTER_IMAGE: vllm/vllm-router@sha256:0eb9f5befddec4cf56346b6f016d8396c721f635f6771c105fc739bbf1e10bcc
  DISAGG_SCRIPTS_STAGE: ${{ inputs.disagg_scripts_stage || '/data/xinhuang/vllm-disagg-logs/' }}
  SPUR_NODE_POOL: ${{ inputs.spur_node_pool || 'ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-5,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-6,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-7,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-8,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-13,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-15,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-16' }}
  AITER_GPU_ARCHS: gfx950
  AITER_BUILD_MAX_JOBS: "64"
  AITER_WHEEL_ARTIFACT_NAME: aiter-vllm-disagg-wheel-${{ github.run_id }}

jobs:
  build_aiter_wheel:
    name: Build gfx950 Aiter wheel (disabled for stock-image A/B)
    if: ${{ false }}
    runs-on: build-only-aiter
    steps:
      - name: Checkout AITER
        uses: actions/checkout@v4

      - name: Sync submodules
        run: |
          set -euo pipefail
          git submodule sync
          git submodule update --init --recursive --depth 1 --jobs 4

      - name: Docker login
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if echo "$DOCKER_PASSWORD" | docker login -u rocmshared --password-stdin; then
              echo "Docker login succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Docker login attempt ${attempt} failed"
            if [ "${attempt}" != 3 ]; then
              sleep 10
            fi
          done
          echo "Docker login failed after 3 attempts, continuing anyway"
          exit 0

      - name: Build AITER wheel in the vLLM nightly image
        run: |
          set -euo pipefail
          bash .github/scripts/docker_pull_with_retry.sh "${BASE_IMAGE}"
          docker run --rm \
            --network=host \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e AITER_USE_SYSTEM_TRITON=1 \
            -e GPU_ARCHS="${AITER_GPU_ARCHS}" \
            -e PREBUILD_KERNELS=0 \
            -e MAX_JOBS="${AITER_BUILD_MAX_JOBS}" \
            --entrypoint /bin/bash \
            "${BASE_IMAGE}" \
            -lc '
              set -euo pipefail
              git config --global --add safe.directory /workspace
              shopt -s nullglob
              rm -rf dist build aiter_meta ./*.egg-info
              rm -f .aiter-build.log
              python3 -c "from importlib.metadata import version; import flydsl; flydsl_version = version(\"flydsl\"); print(f\"Unmodified runtime dependency: flydsl={flydsl_version} at {flydsl.__file__}\")"
              pip uninstall -y aiter amd-aiter || true
              pip config set global.default-timeout 60
              pip config set global.retries 10
              pip install -r requirements.txt
              pip install --upgrade pandas pyzmq einops numpy==1.26.2
              pip install --upgrade "pybind11>=3.0.1"
              pip install --upgrade "ninja>=1.11.1"
              pip install --upgrade "setuptools_scm[toml]>=6.2" wheel packaging psutil
              pip install tabulate
              echo "Building AITER wheel for GPU_ARCHS=${GPU_ARCHS}, PREBUILD_KERNELS=${PREBUILD_KERNELS}, MAX_JOBS=${MAX_JOBS}"
              python setup.py bdist_wheel 2>&1 | tee .aiter-build.log
              ls -lh dist/*.whl
              wheels=(dist/*.whl)
              if (( ${#wheels[@]} != 1 )); then
                echo "Expected exactly one AITER wheel, found ${#wheels[@]}" >&2
                exit 1
              fi
              python3 -c "import sys, zipfile; wheel = sys.argv[1]; archive = zipfile.ZipFile(wheel); names = archive.namelist(); prefix = \"aiter_meta/hsa/\"; arches = {name[len(prefix):].split(\"/\", 1)[0] for name in names if name.startswith(prefix) and \"/\" in name[len(prefix):]}; print(f\"Wheel entries: {len(names)}; packaged HSA arches: {sorted(arches)}\"); assert archive.testzip() is None, \"corrupt wheel member\"; assert \"aiter/__init__.py\" in names; assert any(name.startswith(\"aiter_meta/hsa/gfx950/\") and name.endswith(\".co\") for name in names), \"missing gfx950 code objects\"" "${wheels[0]}"
            '

      - name: Upload AITER wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AITER_WHEEL_ARTIFACT_NAME }}
          path: |
            dist/*.whl
            .aiter-build.log
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  select_vllm_cases:
    name: Select upstream vLLM cases
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'ci:vllm-di') ||
      contains(github.event.pull_request.labels.*.name, 'ci:all')))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout vLLM Buildkite 17 baseline
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: a42850c85f815ab3123a541bc92fb9b35892335e
          fetch-depth: 1
          path: vllm

      - name: Select vLLM-router cases
        id: select
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import itertools
          import json
          import os
          import re
          from pathlib import Path

          pipeline = Path("vllm/.buildkite/amd-disagg/pipeline-disagg.yaml")
          models = {"MiniMax-M3-MXFP8"}
          topologies = {"2P2D": "2P2D-TP8"}
          cases = []
          label = None

          for line in pipeline.read_text(encoding="utf-8").splitlines():
              label_match = re.match(r'\s*-\s+label:\s+["\'](.+)["\']\s*$', line)
              if label_match:
                  label = label_match.group(1)
                  continue

              command_match = re.match(
                  r"\s*-\s+((?:IMAGE=\S+\s+)?MODEL_NAME=.*run-slurm-disagg-test\.sh)\s*$",
                  line,
              )
              if not command_match or not label or not label.endswith("-vllm-router"):
                  continue

              command = command_match.group(1)
              # The historical pipeline used the mutable :nightly tag inline.
              # Replace only that token with the immutable image from build #17.
              command = re.sub(
                  r"^IMAGE=\S+",
                  f"IMAGE={os.environ['BASE_IMAGE']}",
                  command,
                  count=1,
              )
              model_match = re.search(r"(?:^|\s)MODEL_NAME=([^\s]+)", command)
              nodes_match = re.search(r"(?:^|\s)NODES=([0-9]+)", command)
              if not model_match or not nodes_match:
                  continue
              model = model_match.group(1)
              if model not in models:
                  continue

              topology_key = next(
                  (key for key in topologies if f"-PD-{key}-" in label),
                  None,
              )
              if topology_key is None:
                  continue

              topology = topologies[topology_key]
              slug = re.sub(r"[^A-Za-z0-9_.-]+", "-", f"{model}-{topology}")
              cases.append(
                  {
                      "case_name": label,
                      "case_slug": slug,
                      "command": command,
                      "model_name": model,
                      "topology": topology,
                      "nodes": int(nodes_match.group(1)),
                  }
              )

          expected = set(itertools.product(models, topologies.values()))
          selected = {(case["model_name"], case["topology"]) for case in cases}
          if selected != expected or len(cases) != len(expected):
              raise SystemExit(
                  f"Expected exactly {sorted(expected)!r}; selected {sorted(selected)!r} "
                  f"from {pipeline}"
              )

          matrix = json.dumps({"include": cases}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"matrix={matrix}", file=output)

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as output:
              print("### Selected upstream vLLM cases\n", file=output)
              print("| Case | Nodes | Upstream command |", file=output)
              print("|---|---:|---|", file=output)
              for case in cases:
                  print(
                      f'| `{case["case_name"]}` | {case["nodes"]} | '
                      f'`{case["command"]}` |',
                      file=output,
                  )
          PY

  vllm-disagg-smoke:
    name: ${{ matrix.case_name }}
    needs: [select_vllm_cases]
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'ci:vllm-di') ||
      contains(github.event.pull_request.labels.*.name, 'ci:all')))
    runs-on: [self-hosted, aiter-di-ci-spur-login-vllm]
    timeout-minutes: 600
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select_vllm_cases.outputs.matrix) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN_TEST }}
      UPSTREAM_CASE_COMMAND: ${{ matrix.command }}
      CASE_NAME: ${{ matrix.case_name }}
      CASE_SLUG: ${{ matrix.case_slug }}
      MODEL_NAME: ${{ matrix.model_name }}
      TOPOLOGY: ${{ matrix.topology }}
      NODES: ${{ matrix.nodes }}
    steps:
      - name: Show runner and Slurm state
        run: |
          set -euo pipefail
          hostname
          whoami
          pwd
          command -v git
          command -v sbatch
          command -v scontrol
          command -v scancel
          command -v sacct || true
          command -v spur && spur --help | head -120 || true

      - name: Cancel superseded 5-8-only Slurm job
        run: |
          set -euo pipefail
          stale_job_id=4182
          stale_job="$(scontrol show job "${stale_job_id}" 2>/dev/null || true)"
          if [[ -z "${stale_job}" ]]; then
            echo "Superseded Slurm job ${stale_job_id} is no longer present"
            exit 0
          fi
          if ! grep -qE 'JobName=vllm-disagg-pd([[:space:]]|$)' <<< "${stale_job}" || \
             ! grep -qE "UserId=$(whoami)([[:space:]]|$)" <<< "${stale_job}"; then
            echo "Refusing to cancel Slurm job ${stale_job_id}: ownership or job name does not match" >&2
            echo "${stale_job}" >&2
            exit 1
          fi
          echo "Cancelling superseded Slurm job ${stale_job_id} from run 31383654024"
          scancel "${stale_job_id}"

      - name: Checkout vLLM Buildkite 17 baseline
        run: |
          set -euo pipefail
          rm -rf vllm
          git init vllm
          cd vllm
          git remote add origin "${VLLM_REPOSITORY_URL}"
          git fetch --depth=1 origin "${VLLM_BASELINE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${VLLM_BASELINE_SHA}"
          echo "VLLM_BASE_SHA=${VLLM_BASELINE_SHA}" >> "${GITHUB_ENV}"
          echo "VLLM_TEST_SHA=${VLLM_BASELINE_SHA}" >> "${GITHUB_ENV}"

      - name: Configure Spur node pool for topology
        run: |
          set -euo pipefail
          if [[ "${NODES}" != "2" && "${NODES}" != "4" ]]; then
            echo "Unsupported node count: ${NODES}" >&2
            exit 1
          fi

          IFS=',' read -r -a pool_nodes <<< "${SPUR_NODE_POOL}"
          if (( ${#pool_nodes[@]} < NODES )); then
            echo "Spur node pool has ${#pool_nodes[@]} nodes, but ${NODES} are required" >&2
            exit 1
          fi

          declare -A allowed=()
          for node in "${pool_nodes[@]}"; do
            allowed["${node}"]=1
          done

          mapfile -t cluster_nodes < <(sinfo -N -h -o '%N' | sort -Vu)
          declare -A present=()
          excluded_nodes=()
          for node in "${cluster_nodes[@]}"; do
            present["${node}"]=1
            if [[ -z "${allowed[${node}]+x}" ]]; then
              excluded_nodes+=("${node}")
            fi
          done
          for node in "${pool_nodes[@]}"; do
            if [[ -z "${present[${node}]+x}" ]]; then
              echo "Configured Spur node is not present in sinfo: ${node}" >&2
              exit 1
            fi
          done

          exclude="$(IFS=,; echo "${excluded_nodes[*]}")"
          echo "SPUR_NODE_EXCLUDE=${exclude}" >> "${GITHUB_ENV}"
          echo "Configured upstream case ${CASE_NAME}: nodes=${NODES}, pool=${SPUR_NODE_POOL}"

      - name: Show vLLM disagg inputs
        run: |
          set -euo pipefail
          {
            echo "### vLLM disagg smoke input"
            echo
            echo "- vLLM repository: \`${VLLM_REPOSITORY_URL}\`"
            echo "- vLLM Buildkite baseline SHA: \`${VLLM_BASE_SHA}\`"
            echo "- AITER runtime: \`stock pinned image (no AITER overlay)\`"
            echo "- Tested tree SHA: \`${VLLM_TEST_SHA}\`"
            echo "- AITER SHA: \`${GITHUB_SHA}\`"
            echo "- Upstream case: \`${CASE_NAME}\`"
            echo "- Upstream command: \`${UPSTREAM_CASE_COMMAND}\`"
            echo "- IMAGE: \`${BASE_IMAGE}\`"
            echo "- VLLM_ROUTER_IMAGE: \`${VLLM_ROUTER_IMAGE}\`"
            echo "- SPUR_NODE_POOL: \`${SPUR_NODE_POOL}\`"
            echo "- SPUR_NODE_EXCLUDE: \`${SPUR_NODE_EXCLUDE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run upstream vLLM disagg case
        run: |
          set -euo pipefail
          disagg_dir="${GITHUB_WORKSPACE}/vllm/.buildkite/amd-disagg"
          cd "${disagg_dir}"

          script="run-slurm-disagg-test.sh"
          job_script="run_xPyD_disagg.slurm"
          test -f "${script}"
          test -f "${job_script}"

          # Restrict scheduling to the AITER MI350 pool and let Slurm choose
          # any currently available nodes. This allows independent matrix jobs
          # to run concurrently without racing on a preselected nodelist.
          if [[ -n "${SPUR_NODE_EXCLUDE}" ]] && ! grep -q '^#SBATCH --exclude=' "${job_script}"; then
            sed -i "/^#SBATCH --exclusive/a #SBATCH --exclude=${SPUR_NODE_EXCLUDE}" "${job_script}"
            echo "Restricted Slurm scheduling to SPUR_NODE_POOL=${SPUR_NODE_POOL}"
          fi

          submit_log="${GITHUB_WORKSPACE}/slurm-submit.txt"
          sacct_log="${GITHUB_WORKSPACE}/slurm-sacct.txt"
          log_root="${DISAGG_SCRIPTS_STAGE%/}"
          mkdir -p "${log_root}"

          cd "${GITHUB_WORKSPACE}/vllm"
          echo "Running vLLM Buildkite #17 baseline case: ${CASE_NAME}"
          echo "${UPSTREAM_CASE_COMMAND}"

          stream_disagg_logs() {
            local submit_log="$1"
            local done_file="$2"
            local log_root="$3"
            local job_id=""
            local job_log=""
            local role_dir=""
            local logfile=""
            local tail_pid=""
            local -A followed=()
            local -a tail_pids=()

            while [[ ! -f "${done_file}" ]]; do
              job_id="$(grep -oE 'Submitted batch job[[:space:]]+[0-9]+' "${submit_log}" 2>/dev/null | grep -oE '[0-9]+' | tail -1 || true)"
              [[ -n "${job_id}" ]] && break
              sleep 1
            done

            if [[ -z "${job_id}" ]]; then
              job_id="$(grep -oE 'Submitted batch job[[:space:]]+[0-9]+' "${submit_log}" 2>/dev/null | grep -oE '[0-9]+' | tail -1 || true)"
            fi
            if [[ -z "${job_id}" ]]; then
              echo "[live-log] no Slurm job id found; nothing to stream"
              return 0
            fi

            job_log="${log_root}/vllm-disagg-pd-${job_id}.log"
            role_dir="${log_root}/${job_id}"
            echo "[live-log] Slurm job ${job_id}; watching ${job_log} and ${role_dir}/*.log"

            while [[ ! -f "${done_file}" ]]; do
              while IFS= read -r -d '' logfile; do
                if [[ -n "${followed[${logfile}]+x}" ]]; then
                  continue
                fi
                followed["${logfile}"]=1
                echo "[live-log] following ${logfile}"
                tail -n +1 -F -- "${logfile}" &
                tail_pids+=("$!")
              done < <(
                if [[ -f "${job_log}" ]]; then
                  printf '%s\0' "${job_log}"
                fi
                if [[ -d "${role_dir}" ]]; then
                  find "${role_dir}" -maxdepth 1 -type f -name '*.log' -print0 2>/dev/null
                fi
              )
              sleep 5
            done

            # Give existing followers a moment to flush terminal diagnostics,
            # then print any log that appeared between the final scan and exit.
            sleep 2
            while IFS= read -r -d '' logfile; do
              if [[ -z "${followed[${logfile}]+x}" ]]; then
                echo "[live-log] final ${logfile}"
                tail -n +1 -- "${logfile}" || true
              fi
            done < <(
              if [[ -f "${job_log}" ]]; then
                printf '%s\0' "${job_log}"
              fi
              if [[ -d "${role_dir}" ]]; then
                find "${role_dir}" -maxdepth 1 -type f -name '*.log' -print0 2>/dev/null
              fi
            )

            for tail_pid in "${tail_pids[@]}"; do
              kill "${tail_pid}" 2>/dev/null || true
            done
            for tail_pid in "${tail_pids[@]}"; do
              wait "${tail_pid}" 2>/dev/null || true
            done
            echo "[live-log] stopped streaming Slurm job ${job_id}"
          }

          stream_done="${GITHUB_WORKSPACE}/.vllm-disagg-stream-done"
          rm -f "${stream_done}"
          stream_disagg_logs "${submit_log}" "${stream_done}" "${log_root}" &
          stream_pid=$!

          set +e
          env \
            BUILDKITE_COMMIT="${VLLM_BASELINE_SHA}" \
            IMAGE="${BASE_IMAGE}" \
            VLLM_ROUTER_IMAGE="${VLLM_ROUTER_IMAGE}" \
            DISAGG_SCRIPTS_STAGE="${DISAGG_SCRIPTS_STAGE}" \
            LOG_ROOT="${log_root}" \
            bash -lc "${UPSTREAM_CASE_COMMAND}" 2>&1 | tee "${submit_log}"
          wrapper_rc=${PIPESTATUS[0]}
          touch "${stream_done}"
          wait "${stream_pid}" || true
          set -e

          job_id="$(grep -oE 'Submitted batch job[[:space:]]+[0-9]+' "${submit_log}" | grep -oE '[0-9]+' | tail -1 || true)"
          if [[ -n "${job_id}" ]]; then
            echo "SLURM_JOB_ID=${job_id}" >> "${GITHUB_ENV}"
            if command -v sacct >/dev/null 2>&1; then
              sacct -j "${job_id}" --format=JobID,State,ExitCode,Elapsed,NodeList \
                | tee "${sacct_log}" || true
            fi
          else
            echo "Could not parse Slurm job id from ${submit_log}" >&2
            wrapper_rc=1
          fi

          exit "${wrapper_rc}"

      - name: Summarize Slurm result
        if: always()
        run: |
          set -euo pipefail
          {
            echo
            echo "### vLLM disagg smoke result"
            echo
            echo "- Model: \`${MODEL_NAME:-unknown}\`"
            echo "- Topology: \`${TOPOLOGY:-unknown}\`"
            echo "- Image: \`${BASE_IMAGE:-unknown}\`"
            echo "- AITER SHA: \`${GITHUB_SHA}\`"
            echo "- Job ID: \`${SLURM_JOB_ID:-unknown}\`"
            if [[ -f slurm-sacct.txt && -n "${SLURM_JOB_ID:-}" ]]; then
              row="$(awk -v job="${SLURM_JOB_ID}" '$1 == job { print $2, $3, $4; exit }' slurm-sacct.txt || true)"
              read -r state exit_code elapsed <<< "${row}" || true
              echo "- State: \`${state:-unknown}\`; ExitCode: \`${exit_code:-unknown}\`; Elapsed: \`${elapsed:-unknown}\`"
            fi

            job_log="${DISAGG_SCRIPTS_STAGE%/}/vllm-disagg-pd-${SLURM_JOB_ID:-}.log"
            if [[ -f "${job_log}" ]]; then
              cp -f "${job_log}" vllm-disagg-job.log
              overlay_line="$(grep -ahE '\[aiter-overlay\] loaded ' "${job_log}" | head -1 || true)"
              verdict="$(grep -ahE '\[vllm_disagg\] (PASS|FAIL|VERDICT):' "${job_log}" | tail -1 || true)"
              if [[ -n "${overlay_line}" ]]; then
                echo "- AITER overlay: \`${overlay_line}\`"
              else
                echo "- AITER overlay: no load confirmation found"
              fi
              if [[ -n "${verdict}" ]]; then
                echo "- Accuracy verdict: \`${verdict}\`"
              fi
            else
              echo "> No job log at \`${job_log}\`; the workload may not have launched."
            fi

            role_dir=""
            if [[ -n "${SLURM_JOB_ID:-}" ]]; then
              role_dir="${DISAGG_SCRIPTS_STAGE%/}/${SLURM_JOB_ID}"
            fi
            if [[ -n "${role_dir}" && -d "${role_dir}" ]]; then
              mkdir -p vllm-disagg-role-logs
              find "${role_dir}" -maxdepth 1 -type f -name '*.log' \
                -exec cp -f --no-preserve=mode,ownership,timestamps {} vllm-disagg-role-logs/ \;
              echo "- Role logs: copied top-level logs from \`${role_dir}\`"
            else
              echo "> No role-log directory for Slurm job \`${SLURM_JOB_ID:-unknown}\`."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload vLLM disagg smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vllm-disagg-${{ matrix.case_slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            slurm-submit.txt
            slurm-sacct.txt
            vllm-disagg-job.log
            vllm-disagg-role-logs/
