name: vLLM disagg CI smoke workflow

on:
  schedule:
    # Nightly vLLM DI smoke run, 2:30 AM Beijing Time (UTC+8).
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      model_name:
        description: "MODEL_NAME passed to the upstream vLLM disagg case"
        required: false
        type: string
        default: "DeepSeek-V3"
      disagg_scripts_stage:
        description: "Shared path visible to Spur login and compute nodes"
        required: false
        type: string
        default: "/data/xinhuang/vllm-disagg-logs/"
      spur_nodelist:
        description: "Optional comma-separated Spur nodes for the 2-node smoke job"
        required: false
        type: string
        default: "ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-15,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-16"
      image:
        description: "Official vLLM ROCm image used to build and run current AITER"
        required: false
        type: string
        default: "rocm/vllm-dev:nightly"
      slurm_time_limit:
        description: "Wall-clock limit passed to the upstream vLLM Slurm case"
        required: false
        type: string
        default: "08:30:00"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VLLM_REPOSITORY_URL: https://github.com/vllm-project/vllm.git
  VLLM_BRANCH: main
  # TODO: Remove the temporary fetch/cherry-pick after vLLM PR #47030 merges.
  VLLM_DI_PR_NUMBER: "47030"
  BASE_IMAGE: ${{ inputs.image || 'rocm/vllm-dev:nightly' }}
  MODEL_NAME: ${{ inputs.model_name || 'DeepSeek-V3' }}
  DISAGG_SCRIPTS_STAGE: ${{ inputs.disagg_scripts_stage || '/data/xinhuang/vllm-disagg-logs/' }}
  SPUR_NODELIST: ${{ inputs.spur_nodelist || 'ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-13,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-15' }}
  SLURM_TIME_LIMIT: ${{ inputs.slurm_time_limit || '08:30:00' }}
  AITER_WHEEL_ARTIFACT_NAME: aiter-vllm-disagg-whl-${{ github.run_id }}

jobs:
  build_aiter_wheel:
    name: Build Aiter wheel
    runs-on: build-only-aiter
    steps:
      - name: Checkout AITER
        uses: actions/checkout@v4

      - name: Sync submodules
        run: |
          set -euo pipefail
          git submodule sync
          git submodule update --init --recursive --depth 1 --jobs 4

      - name: Docker login
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if echo "$DOCKER_PASSWORD" | docker login -u rocmshared --password-stdin; then
              echo "Docker login succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Docker login attempt ${attempt} failed"
            if [ "${attempt}" != 3 ]; then
              sleep 10
            fi
          done
          echo "Docker login failed after 3 attempts, continuing anyway"
          exit 0

      - name: Build AITER wheel in the vLLM nightly image
        run: |
          set -euo pipefail
          bash .github/scripts/docker_pull_with_retry.sh "${BASE_IMAGE}"
          docker run --rm \
            --network=host \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e AITER_USE_SYSTEM_TRITON=1 \
            "${BASE_IMAGE}" \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /workspace
              shopt -s nullglob
              rm -rf dist build aiter_meta ./*.egg-info
              pip uninstall -y aiter amd-aiter || true
              pip config set global.default-timeout 60
              pip config set global.retries 10
              pip install -r requirements.txt
              pip install --upgrade pandas pyzmq einops numpy==1.26.2
              pip install --upgrade "pybind11>=3.0.1"
              pip install --upgrade "ninja>=1.11.1"
              pip install --upgrade "setuptools_scm[toml]>=6.2" wheel packaging psutil
              pip install tabulate
              python setup.py bdist_wheel
              ls -lh dist/*.whl
            '

      - name: Upload AITER wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AITER_WHEEL_ARTIFACT_NAME }}
          path: dist/*.whl
          retention-days: 14

  vllm-disagg-smoke:
    needs: build_aiter_wheel
    runs-on: [self-hosted, aiter-di-ci-spur-login-vllm]
    timeout-minutes: 600
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN_TEST }}
    steps:
      - name: Download current AITER wheel
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.AITER_WHEEL_ARTIFACT_NAME }}
          path: aiter_wheels

      - name: Show runner and Slurm state
        run: |
          set -euo pipefail
          hostname
          whoami
          pwd
          command -v git
          command -v sbatch
          command -v scontrol
          command -v scancel
          command -v sacct || true
          command -v spur && spur --help | head -120 || true

      - name: Checkout vLLM main and apply PR 47030
        run: |
          set -euo pipefail
          rm -rf vllm
          git init vllm
          cd vllm
          git remote add origin "${VLLM_REPOSITORY_URL}"
          git fetch --depth=1 origin "${VLLM_BRANCH}"
          git checkout --detach FETCH_HEAD
          base_sha="$(git rev-parse HEAD)"

          # Fetch the PR commit and its parent so cherry-pick computes the PR
          # patch instead of treating the shallow commit as a root commit.
          git fetch --depth=2 origin "refs/pull/${VLLM_DI_PR_NUMBER}/head"
          pr_sha="$(git rev-parse FETCH_HEAD)"
          git config user.name "AITER CI"
          git config user.email "aiter-ci@users.noreply.github.com"
          if ! git cherry-pick "${pr_sha}"; then
            if git diff --quiet && git diff --cached --quiet; then
              echo "vLLM PR #${VLLM_DI_PR_NUMBER} is already present on ${VLLM_BRANCH}"
              git cherry-pick --skip
            else
              echo "Failed to apply vLLM PR #${VLLM_DI_PR_NUMBER} to ${VLLM_BRANCH}" >&2
              exit 1
            fi
          fi

          echo "VLLM_BASE_SHA=${base_sha}" >> "${GITHUB_ENV}"
          echo "VLLM_PR_SHA=${pr_sha}" >> "${GITHUB_ENV}"
          echo "VLLM_TEST_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Add current AITER wheel overlay to the upstream case
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=("${GITHUB_WORKSPACE}"/aiter_wheels/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one AITER wheel, found ${#wheels[@]}" >&2
            exit 1
          fi

          disagg_dir="${GITHUB_WORKSPACE}/vllm/.buildkite/amd-disagg"
          test -d "${disagg_dir}"
          mkdir -p "${disagg_dir}/aiter_wheels"
          cp -f "${wheels[0]}" "${disagg_dir}/aiter_wheels/"

          # The upstream case bind-mounts this directory into every compute-node
          # container. Install the artifact into a writable overlay before vLLM
          # starts, leaving the nightly image itself unchanged.
          python3 - "${disagg_dir}/vllm_disagg.sh" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          anchor = 'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"\n'
          hook = r'''

          install_current_aiter() {
              shopt -s nullglob
              local wheels=("${SCRIPT_DIR}"/aiter_wheels/*.whl)
              if (( ${#wheels[@]} != 1 )); then
                  echo "[aiter-overlay] expected one wheel, found ${#wheels[@]}" >&2
                  return 1
              fi

              local overlay="${AITER_OVERLAY_DIR:-/tmp/aiter_overlay}"
              rm -rf "${overlay}"
              mkdir -p "${overlay}"
              python3 -m pip install --disable-pip-version-check --no-deps \
                  --target "${overlay}" "${wheels[0]}"
              export PYTHONPATH="${overlay}${PYTHONPATH:+:${PYTHONPATH}}"
              python3 -c 'import pathlib, sys, aiter; root = pathlib.Path(sys.argv[1]).resolve(); loaded = pathlib.Path(aiter.__file__).resolve(); print(f"[aiter-overlay] loaded {loaded}"); raise SystemExit(0 if root in loaded.parents else 1)' "${overlay}"
          }

          install_current_aiter
          '''
          if anchor not in content:
              raise SystemExit(f"Could not find SCRIPT_DIR anchor in {path}")
          if "install_current_aiter" in content:
              raise SystemExit(f"AITER overlay hook already exists in {path}")
          path.write_text(content.replace(anchor, anchor + hook, 1), encoding="utf-8")
          PY

          ls -lh "${disagg_dir}/aiter_wheels"
          grep -n "aiter-overlay" "${disagg_dir}/vllm_disagg.sh"

      - name: Show vLLM disagg inputs
        run: |
          set -euo pipefail
          {
            echo "### vLLM disagg smoke input"
            echo
            echo "- vLLM repository: \`${VLLM_REPOSITORY_URL}\`"
            echo "- vLLM branch: \`${VLLM_BRANCH}\`"
            echo "- vLLM base SHA: \`${VLLM_BASE_SHA}\`"
            echo "- Temporary vLLM PR: \`#${VLLM_DI_PR_NUMBER}\` at \`${VLLM_PR_SHA}\`"
            echo "- Tested tree SHA: \`${VLLM_TEST_SHA}\`"
            echo "- AITER SHA: \`${GITHUB_SHA}\`"
            echo "- MODEL_NAME: \`${MODEL_NAME}\`"
            echo "- IMAGE: \`${BASE_IMAGE}\`"
            echo "- SPUR_NODELIST: \`${SPUR_NODELIST}\`"
            echo "- SLURM_TIME_LIMIT: \`${SLURM_TIME_LIMIT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run upstream vLLM disagg case
        run: |
          set -euo pipefail
          disagg_dir="${GITHUB_WORKSPACE}/vllm/.buildkite/amd-disagg"
          cd "${disagg_dir}"

          script="run-slurm-disagg-test.sh"
          job_script="run_xPyD_disagg.slurm"
          test -f "${script}"
          test -f "${job_script}"

          # Spur requires fixed nodes in an in-script directive rather than as
          # sbatch CLI resource flags. Keep this AITER-runner detail outside the
          # upstream vLLM environment/model configuration.
          if [[ -n "${SPUR_NODELIST}" ]] && ! grep -q '^#SBATCH --nodelist=' "${job_script}"; then
            sed -i "/^#SBATCH --exclusive/a #SBATCH --nodelist=${SPUR_NODELIST}" "${job_script}"
            echo "Pinned nodes via #SBATCH --nodelist=${SPUR_NODELIST}"
          fi

          submit_log="${GITHUB_WORKSPACE}/slurm-submit.txt"
          sacct_log="${GITHUB_WORKSPACE}/slurm-sacct.txt"
          log_root="${DISAGG_SCRIPTS_STAGE%/}"
          mkdir -p "${log_root}"

          echo "Running upstream vLLM disagg case from PR #${VLLM_DI_PR_NUMBER}"
          set +e
          env \
            BUILDKITE_COMMIT="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            MODEL_NAME="${MODEL_NAME}" \
            IMAGE="${BASE_IMAGE}" \
            NODES=2 \
            GPUS_PER_NODE=8 \
            WAIT=1 \
            SLURM_TIME_LIMIT="${SLURM_TIME_LIMIT}" \
            DISAGG_SCRIPTS_STAGE="${DISAGG_SCRIPTS_STAGE}" \
            LOG_ROOT="${log_root}" \
            bash "${script}" 2>&1 | tee "${submit_log}"
          wrapper_rc=${PIPESTATUS[0]}
          set -e

          job_id="$(grep -oE 'Submitted batch job[[:space:]]+[0-9]+' "${submit_log}" | grep -oE '[0-9]+' | tail -1 || true)"
          if [[ -n "${job_id}" ]]; then
            echo "SLURM_JOB_ID=${job_id}" >> "${GITHUB_ENV}"
            if command -v sacct >/dev/null 2>&1; then
              sacct -j "${job_id}" --format=JobID,State,ExitCode,Elapsed,NodeList \
                | tee "${sacct_log}" || true
            fi
          else
            echo "Could not parse Slurm job id from ${submit_log}" >&2
            wrapper_rc=1
          fi

          exit "${wrapper_rc}"

      - name: Summarize Slurm result
        if: always()
        run: |
          set -euo pipefail
          {
            echo
            echo "### vLLM disagg smoke result"
            echo
            echo "- Model: \`${MODEL_NAME:-unknown}\`"
            echo "- Image: \`${BASE_IMAGE:-unknown}\`"
            echo "- AITER SHA: \`${GITHUB_SHA}\`"
            echo "- Job ID: \`${SLURM_JOB_ID:-unknown}\`"
            if [[ -f slurm-sacct.txt && -n "${SLURM_JOB_ID:-}" ]]; then
              row="$(awk -v job="${SLURM_JOB_ID}" '$1 == job { print $2, $3, $4; exit }' slurm-sacct.txt || true)"
              read -r state exit_code elapsed <<< "${row}" || true
              echo "- State: \`${state:-unknown}\`; ExitCode: \`${exit_code:-unknown}\`; Elapsed: \`${elapsed:-unknown}\`"
            fi

            job_log="${DISAGG_SCRIPTS_STAGE%/}/vllm-disagg-pd-${SLURM_JOB_ID:-}.log"
            if [[ -f "${job_log}" ]]; then
              cp -f "${job_log}" vllm-disagg-job.log
              overlay_line="$(grep -ahE '\[aiter-overlay\] loaded ' "${job_log}" | head -1 || true)"
              verdict="$(grep -ahE '\[vllm_disagg\] (PASS|FAIL|VERDICT):' "${job_log}" | tail -1 || true)"
              if [[ -n "${overlay_line}" ]]; then
                echo "- AITER overlay: \`${overlay_line}\`"
              else
                echo "- AITER overlay: no load confirmation found"
              fi
              if [[ -n "${verdict}" ]]; then
                echo "- Accuracy verdict: \`${verdict}\`"
              fi
            else
              echo "> No job log at \`${job_log}\`; the workload may not have launched."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload vLLM disagg smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vllm-disagg-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            slurm-submit.txt
            slurm-sacct.txt
            vllm-disagg-job.log
