name: AITER-triton Kernels board

# Keeps the AITER-triton Kernels board
# (https://github.com/orgs/ROCm/projects/232) in step with the repo by applying
# the Triton/Gluon label. The board itself does the rest through its built-in
# workflows: "Auto-add to project" (label:Triton/Gluon) puts items on the board,
# and "Item added", "Code review approved", "Pull request merged", "Item closed"
# and "Item reopened" set their Status. This workflow never touches the board,
# so it needs no organization permissions.
#
# A PR or issue gets the label when any of these hold:
#   1. it is authored by (PRs), or assigned to, someone listed in
#      .github/triton-board-team.txt (@ROCm/triton_kernels_team);
#   2. its diff touches Triton/Gluon code (TRITON_PATHS) or Triton CI
#      (TRITON_CI: anything under .github/ with "triton" in its path, plus
#      requirements-triton*).
#
# The label is never removed here, so labels people add or remove by hand are
# left alone, except that a PR still matching rule 2 gets it back on its next
# event.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - synchronize
      - assigned
      - unassigned
      - labeled
      - unlabeled
  issues:
    types: [opened, reopened, assigned, unassigned, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: triton-board-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label Triton work
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'Triton/Gluon';
            const ROSTER = '.github/triton-board-team.txt';
            const TRITON_PATHS = [
              'aiter/ops/triton/',
              'aiter/aot/triton/',
              'aiter/utility/triton/',
              'op_tests/triton_tests/',
              'op_tests/op_benchmarks/triton/',
            ];
            const TRITON_CI = [/^\.github\/.*triton/i, /^requirements-triton/i];

            const { owner, repo } = context.repo;
            const isPR = Boolean(context.payload.pull_request);
            const number = (context.payload.pull_request ?? context.payload.issue).number;
            const what = `${isPR ? 'PR' : 'issue'} #${number}`;

            // Work from the current state, not the event payload: by the time
            // this runs the PR may have been relabeled, reassigned or closed.
            const item = isPR
              ? (await github.rest.pulls.get({ owner, repo, pull_number: number })).data
              : (await github.rest.issues.get({ owner, repo, issue_number: number })).data;

            if (item.state !== 'open') {
              core.info(`${what} is closed — nothing to do.`);
              return;
            }
            if ((item.labels ?? []).some(l => l.name === LABEL)) {
              core.info(`${what} is already labeled ${LABEL}.`);
              return;
            }

            const reasons = [];

            // Rule 1: read from the default branch, never from the PR.
            const { data: roster } = await github.rest.repos.getContent({
              owner,
              repo,
              path: ROSTER,
              ref: context.payload.repository.default_branch,
            });
            const team = new Set(Buffer.from(roster.content, 'base64').toString()
              .split('\n').map(l => l.trim().toLowerCase()).filter(Boolean));
            const people = (item.assignees ?? []).map(a => a.login);
            if (isPR) people.unshift(item.user.login);
            const ours = people.filter(login => team.has(login.toLowerCase()));
            if (ours.length) {
              reasons.push(`team: ${[...new Set(ours)].join(', ')}`);
            }

            // Rule 2: the diff itself.
            if (isPR) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: number,
                per_page: 100,
              });
              const names = files.map(f => f.filename);
              if (names.some(f => TRITON_PATHS.some(p => f.startsWith(p)))) {
                reasons.push('touches Triton/Gluon paths');
              }
              if (names.some(f => TRITON_CI.some(re => re.test(f)))) {
                reasons.push('touches Triton CI');
              }
            }

            if (!reasons.length) {
              core.info(`${what} does not belong on the board.`);
              return;
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [LABEL] });
            core.info(`${what}: labeled ${LABEL} (${reasons.join('; ')}).`);
