# aiter-review-bot — on-demand PR review triggered by an `@aiter-bot review` comment.
# Native issue_comment trigger, no polling and no local daemon. Runs on a self-hosted
# runner (box308) and posts as the aiter-bot account.
#
# Install at ROCm/aiter as .github/workflows/aiter-review-bot.yml and merge to the
# default branch (issue_comment workflows only run from the definition on the default
# branch). The review tooling lives in the review-pr skill dir (.claude/skills/review-pr/) and
# so the runner gets everything by checkout; only claude-glm (the internal AI backend)
# is provisioned on the runner box.
#
# Trigger (an authorized aiter-team member comments on a PR):
#   @aiter-bot review      first pass
#   @aiter-bot re-review   after the author pushes fixes
# Commands inside quote (`>`) lines do not trigger; non-allowlisted commenters are ignored.
#
# Chain (all on the runner, scripts from .claude/skills/review-pr/):
#   gate (allowlist + real-trigger check) -> claim 👀 -> run_one.sh (headless GLM review)
#   -> publish.sh (hold 🔴 for a human, post non-🔴, as aiter-bot)
name: aiter-review-bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: read          # read-only; comments are posted with the aiter-bot PAT

concurrency:
  # Serialize repeated triggers on the same PR; do not cancel an in-flight review.
  group: aiter-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # Cheap pre-filter: must be a PR comment carrying a command (the real, quote-aware
    # check runs in the gate step below).
    if: >
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '@aiter-bot review') ||
       contains(github.event.comment.body, '@aiter-bot re-review'))
    runs-on: [self-hosted, box308]        # label the runner with these at registration
    env:
      PR: ${{ github.event.issue.number }}          # issue number == PR number here
      COMMENTER: ${{ github.event.comment.user.login }}
      AITER_BOT_TOKEN: ${{ secrets.AITER_BOT_TOKEN }}
      # Kernel validation off by default (self-hosted + public repo). Enable per-need.
      REVIEW_AUTO_VALIDATE: '0'
    steps:
      - name: Checkout tooling (base/main, trusted)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # full history: fetch.sh needs to fetch PR + merge-target refs
          persist-credentials: false

      - name: Resolve tooling dir
        id: rl
        run: echo "dir=${GITHUB_WORKSPACE}/.claude/skills/review-pr" >> "$GITHUB_OUTPUT"

      - name: Gate — aiter-team allowlist + real trigger (skip quote lines)
        id: gate
        env:
          BODY: ${{ github.event.comment.body }}
          AITER_REVIEW_AUTHORIZED: ${{ vars.AITER_REVIEW_AUTHORIZED }}   # optional repo var; empty -> allowlist file
          RL: ${{ steps.rl.outputs.dir }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, pathlib
          body = os.environ.get('BODY', '')
          who  = os.environ.get('COMMENTER', '').strip().lower()
          # 1) Real trigger: line-based; skip quote (>) lines; re-review before review
          #    (re-review contains the substring 'review').
          TRIG = [('re-review', re.compile(r'@aiter-bot\s+re-?review\b', re.I)),
                  ('review',    re.compile(r'@aiter-bot\s+review\b', re.I))]
          kind = None
          for raw in body.splitlines():
              if raw.lstrip().startswith('>'):
                  continue
              for k, rx in TRIG:
                  if rx.search(raw):
                      kind = k; break
              if kind: break
          # 2) Authorization: repo var AITER_REVIEW_AUTHORIZED wins, else allowlist file
          allow = set()
          v = os.environ.get('AITER_REVIEW_AUTHORIZED', '')
          if v.strip():
              allow = {x.strip().lower() for x in v.split(',') if x.strip()}
          else:
              f = pathlib.Path(os.environ['RL']) / 'authorized.txt'
              if f.is_file():
                  allow = {l.strip().lower() for l in f.read_text().splitlines()
                           if l.strip() and not l.startswith('#')}
          ok = bool(kind) and who in allow
          print(f'ok={"true" if ok else "false"}')
          print(f'kind={kind or ""}')
          if not kind:
              print('reason=command only in a quote line or absent')
          elif who not in allow:
              print('reason=commenter not on the aiter-team allowlist')
          PY

      - name: Gate result
        run: |
          echo "commenter=$COMMENTER kind=${{ steps.gate.outputs.kind }} ok=${{ steps.gate.outputs.ok }} ${{ steps.gate.outputs.reason }}"
          [ "${{ steps.gate.outputs.ok }}" = "true" ] || { echo "::notice::ignored — ${{ steps.gate.outputs.reason }}"; exit 0; }

      - name: Claim 👀 (as aiter-bot)
        if: steps.gate.outputs.ok == 'true'
        run: |
          curl -s -X POST -H "Authorization: token $AITER_BOT_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -d '{"content":"eyes"}' >/dev/null || true

      - name: Review (headless GLM)
        if: steps.gate.outputs.ok == 'true'
        run: bash "${{ steps.rl.outputs.dir }}/run_one.sh" "$PR"

      - name: Publish gate (hold 🔴, post non-🔴)
        if: steps.gate.outputs.ok == 'true'
        run: python3 "${{ steps.rl.outputs.dir }}/_publish.py" "$PR" --post
