name: Prepare Triton Wheel

on:
  workflow_call:
    inputs:
      docker-image:
        description: Docker image used to resolve and download the matching Triton wheel.
        required: true
        type: string
      artifact-name:
        description: Name of the Triton wheel artifact uploaded for the caller workflow run.
        required: true
        type: string
      cache-key:
        description: Optional cache key override used to share the Triton wheelhouse with downstream jobs.
        required: false
        type: string
        default: ""
      retention-days:
        description: Number of days to keep the Triton wheel artifact.
        required: false
        type: number
        default: 3
    outputs:
      cache_key:
        description: Cache key used to share the Triton wheelhouse with downstream jobs.
        value: ${{ jobs.prepare.outputs.cache_key }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.triton_cache_key.outputs.cache_key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute Triton wheel cache key
        id: triton_cache_key
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          CACHE_KEY_INPUT: ${{ inputs.cache-key }}
          DOCKER_IMAGE: ${{ inputs.docker-image }}
        run: |
          set -euo pipefail

          if [ -n "${CACHE_KEY_INPUT}" ]; then
            cache_key="${CACHE_KEY_INPUT}"
          else
            inputs_hash="$(
              printf '%s\n%s\n' "${DOCKER_IMAGE}" "${ARTIFACT_NAME}" |
                sha256sum |
                cut -c1-16
            )"
            files_hash="$(
              sha256sum \
                .github/scripts/download_triton_wheel.sh \
                .github/scripts/install_triton.sh \
                .github/workflows/prepare-triton-wheel.yaml |
                sha256sum |
                cut -c1-16
            )"
            cache_key="${RUNNER_OS:-Linux}-triton-wheel-v1-${inputs_hash}-${files_hash}"
          fi

          echo "cache_key=${cache_key}" >> "${GITHUB_OUTPUT}"
          echo "Triton wheel cache key: ${cache_key}"

      - name: Restore Triton wheel cache
        id: restore_triton_wheel
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 30
        with:
          path: triton_wheels
          key: ${{ steps.triton_cache_key.outputs.cache_key }}

      - name: Download Triton wheel
        if: steps.restore_triton_wheel.outputs.cache-hit != 'true'
        id: download_triton_wheel
        env:
          TRITON_DEFAULT_ROCM_VERSION: "7.2.0"
          DOCKER_IMAGE: ${{ inputs.docker-image }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf triton_wheels

          if bash .github/scripts/docker_pull_with_retry.sh "${DOCKER_IMAGE}"; then
            if docker run --rm \
              -v "${WORKSPACE}:/workspace" \
              -w /workspace \
              "${DOCKER_IMAGE}" \
              bash ./.github/scripts/download_triton_wheel.sh triton_wheels; then
              echo "source=image" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::warning::Triton wheel download inside ${DOCKER_IMAGE} failed; falling back to ROCm ${TRITON_DEFAULT_ROCM_VERSION}"
          else
            echo "::warning::Failed to pull ${DOCKER_IMAGE}; falling back to ROCm ${TRITON_DEFAULT_ROCM_VERSION}"
          fi

          docker system prune -af || true
          rm -rf triton_wheels
          bash ./.github/scripts/download_triton_wheel.sh triton_wheels
          echo "source=fallback-rocm-${TRITON_DEFAULT_ROCM_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Save Triton wheel cache
        if: steps.restore_triton_wheel.outputs.cache-hit != 'true' && steps.download_triton_wheel.outputs.source == 'image'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: triton_wheels
          key: ${{ steps.triton_cache_key.outputs.cache_key }}

      - name: Upload Triton wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: triton_wheels/
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}
