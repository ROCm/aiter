name: MoE 2-Stage Full Matrix

# Dedicated scheduled/on-demand home for the exhaustive test_moe_2stage.py
# sweep. Kept out of aiter-test.yaml's shared `standard` job so that job
# stays generic (no MoE-specific tokens, --no-flydsl-csv, or log-grep
# patterns baked into it) per the review discussion on PR #7330/#7341.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'  # 6:00 AM Beijing Time (UTC+8)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci_config:
    uses: ./.github/workflows/ci-config.yaml

  full-matrix:
    name: Full MoE 2-Stage Matrix (MI35X)
    runs-on: linux-aiter-mi35x-1
    needs: ci_config
    timeout-minutes: 90
    env:
      DOCKER_IMAGE: ${{ needs.ci_config.outputs.pytorch_py312_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync CK submodule
        run: |
          set -ex
          git submodule sync
          git submodule update --init --recursive --depth 1 --jobs 4

      - name: Clean up ROCm processes
        run: ./.github/scripts/clean_up_rocm.sh

      - name: Start container
        run: |
          set -ex
          if [ -f "/etc/podinfo/gha-render-devices" ]; then
            DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)
          else
            DEVICE_FLAG="--device /dev/dri"
          fi
          docker run -dt \
            --device=/dev/kfd $DEVICE_FLAG \
            --shm-size=16G \
            --network=host \
            --group-add $(getent group render | cut -d: -f3) \
            --group-add $(getent group video | cut -d: -f3) \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --name moe_2stage_full_matrix \
            $DOCKER_IMAGE

      - name: Build Aiter (no Triton needed for this suite)
        run: |
          set -ex
          docker exec -w /workspace moe_2stage_full_matrix \
            bash -lc "BUILD_TRITON=0 ./.github/scripts/build_aiter_triton.sh"

      - name: Run full MoE 2-stage matrix
        run: |
          set -euo pipefail
          start_time_ns=$(date +%s%N)
          if ! docker exec -w /workspace moe_2stage_full_matrix \
              bash -lc 'AITER_MOE_2STAGE_CI_PROFILE=full timeout 75m python3 -u op_tests/test_moe_2stage.py 2>&1' \
              | tee full_matrix.log; then
              status="❌ Failed"
              failed=true
          else
              status="✅ Passed"
              failed=false
          fi

          # Known baseline: 12 pre-existing mxfp4 per_1x32 non-strict accuracy
          # warnings (7 bf16-activation, 5 fp4-activation; see PR #7330/#7341
          # discussion, main run 41552231943). These are tracked separately
          # and are not caused by this CI-scoping change. Only flag a
          # regression if the observed count exceeds the known baseline.
          KNOWN_NONSTRICT_ACCURACY_FAILURES=12
          nonstrict_failures=$(grep -c "accuracy check failed (non-strict)" full_matrix.log || true)
          if [[ "$nonstrict_failures" -gt "$KNOWN_NONSTRICT_ACCURACY_FAILURES" ]]; then
              status="❌ Failed (non-strict accuracy regressions: ${nonstrict_failures} > baseline ${KNOWN_NONSTRICT_ACCURACY_FAILURES})"
              failed=true
          elif [[ "$nonstrict_failures" -gt 0 ]]; then
              status="${status} (⚠️ ${nonstrict_failures} known non-strict accuracy warnings, within baseline of ${KNOWN_NONSTRICT_ACCURACY_FAILURES})"
          fi

          end_time_ns=$(date +%s%N)
          elapsed_s=$(awk "BEGIN{printf \"%.3f\", ($end_time_ns-$start_time_ns)/1000000000}")
          {
            echo "## MoE 2-Stage Full Matrix"
            echo
            echo "**${status}** — ${elapsed_s}s"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$failed" == "true" ]]; then
            exit 1
          fi

      - name: Upload full matrix log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moe-2stage-full-matrix-log-${{ github.run_id }}
          path: full_matrix.log
          retention-days: 14
        continue-on-error: true

      - name: Cleanup container
        if: always()
        run: docker rm -f moe_2stage_full_matrix || true

      - name: Clean up ROCm processes
        if: always()
        run: ./.github/scripts/clean_up_rocm.sh
