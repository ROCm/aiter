name: PR Self-Review Selftest

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/pr_self_review.py'
      - '.github/scripts/pr_self_review_selftest.py'
      - '.github/workflows/pr-self-review.yml'
      - '.github/workflows/pr-self-review-signal.yml'
      - '.github/workflows/pr-self-review-selftest.yml'
      - '.github/pull_request_template.md'
  push:
    branches: [main]
    paths:
      - '.github/scripts/pr_self_review.py'
      - '.github/scripts/pr_self_review_selftest.py'
      - '.github/workflows/pr-self-review.yml'
      - '.github/workflows/pr-self-review-signal.yml'
      - '.github/workflows/pr-self-review-selftest.yml'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run deterministic gate scenarios
        run: python3 .github/scripts/pr_self_review_selftest.py
