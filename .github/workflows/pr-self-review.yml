name: PR Self-Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Checks, Aiter Test]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to refresh
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: pr-self-review-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    # workflow_run may describe a main/scheduled run rather than a pull request.
    # Review events do not support a branches filter, so constrain their base here.
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.pull_requests[0].number) &&
      (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target and workflow_run both check out the trusted default branch.
      # Never change this to the pull request head: this job has write permission.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Evaluate author self-review, Copilot findings, hygiene and required CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
          SELF_REVIEW_MODE: ${{ vars.AITER_PR_SELF_REVIEW_MODE || 'shadow' }}
        run: python3 .github/scripts/pr_self_review.py --apply
