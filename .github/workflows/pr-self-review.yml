name: PR Self-Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [Checks, Aiter Test, PR Self-Review Signal]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to refresh
        required: true
        type: number

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: pr-self-review-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || inputs.pr || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    # workflow_run may describe a main/scheduled run rather than a pull request.
    if: >-
      (github.event_name != 'workflow_run' ||
       contains(fromJSON('["pull_request","pull_request_review","pull_request_review_comment"]'),
                github.event.workflow_run.event)) &&
      (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This job has write permission. Pin checkout explicitly because review events and
      # workflow_run metadata may otherwise select a pull request merge ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate author self-review, Copilot findings, hygiene and required CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
          WORKFLOW_HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SELF_REVIEW_MODE: ${{ vars.AITER_PR_SELF_REVIEW_MODE || 'shadow' }}
        run: python3 .github/scripts/pr_self_review.py --apply
