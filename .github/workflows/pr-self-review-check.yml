name: PR Self-Review Static Check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/pr_self_review.py'
      - '.github/workflows/pr-self-review.yml'
      - '.github/workflows/pr-self-review-check.yml'
      - '.github/pull_request_template.md'
  push:
    branches: [main]
    paths:
      - '.github/scripts/pr_self_review.py'
      - '.github/workflows/pr-self-review.yml'
      - '.github/workflows/pr-self-review-check.yml'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check Python syntax
        run: python3 -m py_compile .github/scripts/pr_self_review.py

      - name: Lint for runtime errors
        run: |
          pip3 install --quiet ruff==0.16.0
          ruff check --no-cache --select F,E9 \
            .github/scripts/pr_self_review.py
