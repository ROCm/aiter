name: PR Title Tags, Labels & Assignees

# Keeps PR-title component tags ([Triton/Gluon], [HIP], [ASM], [CK], ...) and
# the matching PR labels uniform and always in sync with the PR's changed
# files. The title is capped at 3 tags for readability; the labels carry the
# full component set.
#
# The diff is the source of truth: on every push, bracket tags in the
# component namespace (any variant — [TRITON], [Gluon], [CK_TILE],
# [Triton-Gluon-MLA-GFX950], ...) are recomputed from the changed files, so
# dropped components disappear and new ones appear. Tags outside the
# component namespace ([fix], [Perf], [MLA], [gfx1250], ...) are never
# touched. The same rule applies to labels: only the component labels listed
# in COMPONENT_LABELS are ever added or removed — human labels (ci:*, ...)
# are left alone, while hand-toggling a managed component label is corrected
# on the spot. To opt a PR out entirely, add the 'no-auto-title' label — it
# takes effect immediately, and removing it re-syncs the PR on the spot.
#
# The tag set is documented in CONTRIBUTE.md ("PR Title Format") — keep the
# two in sync when adding or renaming tags.
#
# With the repository variable PR_ASSIGN_COMMITTERS set to 'true', the PR is
# also assigned to everyone who has committed to it (last step).
#
# pull_request_target is used so the default token can edit titles on fork
# PRs as well. This is safe here because the job never checks out or executes
# PR code — it only reads the changed-file list from the API.

on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  pull-requests: write
  issues: write  # labels and assignees on PRs go through the issues API

concurrency:
  group: pr-title-tags-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tag-title:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Sync component tags in PR title
        uses: actions/github-script@v7
        with:
          script: |
            // The component labels this workflow owns (name -> color). Only
            // these are ever added or removed; anything else on the PR
            // (ci:*, no-auto-title, ...) belongs to humans.
            const COMPONENT_LABELS = {
              'Triton/Gluon': '1d76db',
              'ASM':          '5319e7',
              'HIP':          'b60205',
              'CK':           '0e8a16',
              'OPUS':         'fbca04',
              'FlyDSL':       'd93f0b',
              'CI':           'bfdadc',
              'JIT':          'c5def5',
              'Build':        'bfd4f2',
              'Config':       'f9d0c4',
              'Docs':         '0075ca',
            };

            // Label events run the sync only when they can change the outcome:
            // the opt-out label, or a managed component label being toggled by
            // hand (which the sync corrects on the spot). Events for any other
            // label (ci:*, ...) are skipped. The bot's own label writes echo
            // back here too — they find everything in sync and exit without
            // API calls, so there is no loop.
            const action = context.payload.action;
            const eventLabel = context.payload.label?.name;
            if ((action === 'labeled' || action === 'unlabeled')
                && eventLabel !== 'no-auto-title'
                && !Object.hasOwn(COMPONENT_LABELS, eventLabel)) {
              core.info(`Label '${eventLabel}' is not managed — skipping.`);
              return;
            }
            const pr = context.payload.pull_request;
            if (pr.labels.some(l => l.name === 'no-auto-title')) {
              core.info("Label 'no-auto-title' set — skipping.");
              return;
            }

            // ---- changed files (paginated) ----
            const files = (await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            })).map(f => f.filename);

            // ---- path predicates ----
            const isDoc    = f => f.startsWith('docs/') || f.endsWith('.md');
            const isTriton = f => f.startsWith('aiter/ops/triton/')
                               || f.startsWith('aiter/aot/triton/')
                               || f.startsWith('aiter/utility/triton/')
                               || f.startsWith('op_tests/triton_tests/')
                               || f.startsWith('op_tests/op_benchmarks/triton/');
            const isAsm    = f => f.startsWith('hsa/') || /_asm\.py$/.test(f);
            const isCk     = f => /^csrc\/(ck_|cktile_|py_itfs_ck\/|include\/ck_tile\/)/.test(f)
                               || f.startsWith('3rdparty/composable_kernel');
            const isOpus   = f => f.startsWith('aiter/ops/opus/')
                               || f.startsWith('csrc/opus_gemm/')
                               || f.startsWith('csrc/opus_moe/')
                               || f.startsWith('csrc/include/opus/')
                               || f.startsWith('op_tests/opus/')
                               || /^aiter\/ops\/[^/]*opus[^/]*\.py$/.test(f)
                               || /^op_tests\/[^/]*opus[^/]*\.py$/.test(f);
            const isHip    = f => (f.startsWith('csrc/') && !isCk(f) && !isOpus(f))
                               || f.startsWith('op_tests/op_benchmarks/hip/');
            const isFlyDsl = f => f.startsWith('aiter/ops/flydsl/')
                               || f.startsWith('aiter/aot/flydsl/')
                               || f.startsWith('op_tests/flydsl_tests/')
                               || /^op_tests\/[^/]*flydsl[^/]*\.py$/.test(f);
            const isCi     = f => f.startsWith('.github/');
            const isJit    = f => f.startsWith('aiter/jit/');
            const isBuild  = f => ['setup.py', 'pyproject.toml', 'MANIFEST.in'].includes(f)
                               || /^requirements[^/]*\.txt$/.test(f);
            const isConfig = f => f.startsWith('aiter/configs/')
                               || f.startsWith('aiter/ops/triton/configs/');

            // Doc files never contribute component tags: a docs-only PR gets
            // [Docs], and a code PR that also touches a README is tagged by
            // its code only.
            const code = files.filter(f => !isDoc(f));

            // ---- compute canonical tags from the diff, priority order ----
            const tags = [];
            if (code.some(isTriton))           tags.push('Triton/Gluon');
            if (code.some(isAsm))              tags.push('ASM');
            if (code.some(isHip))              tags.push('HIP');
            if (code.some(isCk))               tags.push('CK');
            if (code.some(isOpus))             tags.push('OPUS');
            if (code.some(isFlyDsl))           tags.push('FlyDSL');
            if (code.some(isCi))               tags.push('CI');
            if (code.some(isJit))              tags.push('JIT');
            if (code.some(isBuild))            tags.push('Build');
            if (code.length && code.every(isConfig)) tags.push('Config');
            if (files.length && files.every(isDoc))  tags.push('Docs');
            const MAX_TAGS = 3;
            const add = tags.slice(0, MAX_TAGS);

            // ---- rebuild the title: computed tags own the component space ----
            // Strip every bracket token containing a component word (any
            // variant or compound), keep all other tokens and text, then
            // prepend the computed canonical set.
            const COMPONENT_WORDS = new Set([
              'triton', 'gluon', 'ck', 'cktile', 'asm', 'hip', 'opus',
              'flydsl', 'ci', 'jit', 'build', 'config', 'docs', 'doc',
            ]);
            const tokenWords = t => t.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
            const original = pr.title;
            const stripped = original.replace(/\s*\[[^\]]+\]/g, (m) =>
              tokenWords(m).some(w => COMPONENT_WORDS.has(w)) ? '' : m
            ).replace(/\s{2,}/g, ' ').trim();

            const newTitle = (add.map(t => `[${t}]`).join(' ') + ' ' + stripped).trim();
            if (newTitle === original) {
              core.info(`Title already in sync (computed: ${JSON.stringify(tags)})`);
            } else {
              core.info(`Retitling: "${original}" -> "${newTitle}"`);
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title: newTitle,
              });
            }

            // ---- labels: mirror the FULL computed component set (uncapped) ----
            const current = pr.labels
              .map(l => l.name)
              .filter(name => name in COMPONENT_LABELS);
            const labelsToAdd = tags.filter(t => !current.includes(t));
            const labelsToRemove = current.filter(name => !tags.includes(name));

            for (const name of labelsToAdd) {
              // Make sure the label exists with our color; 422 = already exists.
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color: COMPONENT_LABELS[name],
                });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }
            if (labelsToAdd.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labelsToAdd,
              });
            }
            for (const name of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name,
                });
              } catch (e) {
                if (e.status !== 404) throw e;  // already gone is fine
              }
            }
            if (labelsToAdd.length || labelsToRemove.length) {
              core.info(`Labels: +[${labelsToAdd}] -[${labelsToRemove}]`);
            } else {
              core.info('Labels already in sync.');
            }

      - name: Assign the PR to everyone who committed to it
        # Add-only; anyone unassigned by hand stays off. Not filtered by event
        # action: a run cancelled by a label change is finished by its replacement.
        if: ${{ vars.PR_ASSIGN_COMMITTERS == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const MAX_ASSIGNEES = 10;  // GitHub's cap

            const { owner, repo } = context.repo;
            // Re-read: the payload is the state at event time, this runs later.
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.pull_request.number,
            });
            if (pr.labels.some(l => l.name === 'no-auto-title')) {
              core.info("Label 'no-auto-title' set — skipping.");
              return;
            }
            const already = new Set(pr.assignees.map(a => a.login));
            const slots = MAX_ASSIGNEES - already.size;
            if (slots <= 0) {
              core.info(`Already at the ${MAX_ASSIGNEES}-assignee limit.`);
              return;
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const weight = new Map();
            for (const c of commits) {
              const login = c.author?.login;
              if (!login) continue;
              if (c.author.type === 'Bot' || login.endsWith('[bot]')) continue;
              weight.set(login, (weight.get(login) || 0) + 1);
            }

            // Latest assign/unassign event per login wins.
            const lastAction = new Map();
            const events = await github.paginate(github.rest.issues.listEvents, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            for (const e of events) {
              if (e.event !== 'assigned' && e.event !== 'unassigned') continue;
              if (e.assignee?.login) lastAction.set(e.assignee.login, e.event);
            }
            const removed = new Set(
              [...lastAction].filter(([, a]) => a === 'unassigned').map(([l]) => l)
            );

            const ranked = [...weight.entries()]
              .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
              .map(([login]) => login)
              .filter(login => !already.has(login) && !removed.has(login));

            // addAssignees silently drops users without push access; probe first.
            const assignees = [];
            const unassignable = [];
            for (const login of ranked) {
              if (assignees.length >= slots) break;
              try {
                await github.request('GET /repos/{owner}/{repo}/assignees/{assignee}', {
                  owner, repo, assignee: login,
                });
                assignees.push(login);
              } catch (e) {
                if (e.status !== 404) throw e;
                unassignable.push(login);
              }
            }

            if (removed.size) {
              core.info(`Unassigned by hand, left off: ${[...removed].join(', ')}`);
            }
            if (unassignable.length) {
              core.summary.addRaw(
                `Committers without push access, not assignable: ${unassignable.join(', ')}`
              );
              await core.summary.write();
            }
            if (!assignees.length) {
              core.info('No new assignable committers.');
              return;
            }
            await github.rest.issues.addAssignees({
              owner, repo, issue_number: pr.number, assignees,
            });
            core.info(`Assigned ${assignees.length}: ${assignees.join(', ')}`);
