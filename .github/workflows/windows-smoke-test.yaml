name: Windows Smoke Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]
    paths:
      - ".github/workflows/windows-smoke-test.yaml"
      - "aiter/**"
      - "csrc/**"
      - "op_tests/windows/**"
      - "requirements.txt"
      - "setup.py"
  workflow_dispatch:
  schedule:
    # Run daily at 9 PM Beijing Time (UTC+8)
    - cron: '0 13 * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-signal:
    if: >-
      !github.event.pull_request ||
      (github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'ci:windows') ||
      contains(github.event.pull_request.labels.*.name, 'ci:all')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Checks workflow
        run: ./.github/scripts/check_signal.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}

  jit-op-smoke:
    name: JIT op smoke (gfx1201, Radeon R9700)
    if: >-
      !github.event.pull_request ||
      (github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'ci:windows') ||
      contains(github.event.pull_request.labels.*.name, 'ci:all')))
    needs: [check-signal]
    runs-on: [self-hosted, linux, xsj-dispatch, radeon-r9700]
    timeout-minutes: 90
    env:
      GFX: gfx1201
      ROCM_INDEX: https://stable.repo.amd.com/rocm/whl-next/
      ROCM_VERSION: 10.1.0
      TORCH_VERSION: 2.14.0+rocm10.1.0
      AITER_USE_SYSTEM_TRITON: "1"
      # Keep this smoke test focused on JIT/Triton ops.
      ENABLE_CK: "0"
      PREBUILD_KERNELS: "0"

    steps:
      - name: Checkout aiter repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.GFX }}-rocm${{ env.ROCM_VERSION }}-torch${{ env.TORCH_VERSION }}

      - name: Install ROCm and PyTorch from ROCm pip index
        shell: bash
        run: |
          set -euo pipefail

          venv="${RUNNER_TEMP}/aiter-windows-smoke"
          rm -rf "$venv"

          python --version
          python -m venv "$venv"
          python_bin="${venv}/bin/python"

          "$python_bin" --version
          "$python_bin" -m pip install --upgrade pip
          "$python_bin" -m pip install \
            --index-url "$ROCM_INDEX" \
            "torch[device-${GFX}]==${TORCH_VERSION}" \
            "rocm[devel,device-${GFX}]==${ROCM_VERSION}"
          "$python_bin" -m rocm_sdk init

      - name: Install aiter
        shell: bash
        run: |
          set -euo pipefail

          venv="${RUNNER_TEMP}/aiter-windows-smoke"
          python_bin="${venv}/bin/python"

          "$python_bin" -m pip install --upgrade \
            -r requirements.txt \
            wheel \
            "setuptools_scm<10" \
            numpy

          "$python_bin" - <<'PY'
          import os
          import sys

          sys.path.insert(0, os.path.join(os.getcwd(), "aiter", "jit", "utils"))
          from cpp_extension import HIP_VERSION, IS_HIP_EXTENSION, ROCM_HOME, executable_path

          print(f"ROCM_HOME={ROCM_HOME!r}")
          print(f"HIP_VERSION={HIP_VERSION!r}")
          print(f"IS_HIP_EXTENSION={IS_HIP_EXTENSION}")

          if not ROCM_HOME or not IS_HIP_EXTENSION:
              raise SystemExit(
                  "ROCm toolchain was not detected after rocm_sdk init; "
                  "expected rocm[devel] to expose a usable HIP SDK."
              )

          for tool in ("hipconfig", "hipcc"):
              print(f"{tool}={executable_path(tool)}")
          PY

          "$python_bin" -m pip install -e . --no-build-isolation -v

      - name: Run op_tests/windows
        shell: bash
        run: |
          set -euo pipefail

          venv="${RUNNER_TEMP}/aiter-windows-smoke"
          python_bin="${venv}/bin/python"
          log_path="${RUNNER_TEMP}/windows-smoke-test.log"

          "$python_bin" -m pytest -q -s op_tests/windows 2>&1 | tee "$log_path"

      - name: Summarize Windows smoke accuracy
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          log_path="${RUNNER_TEMP}/windows-smoke-test.log"

          {
            echo "## Windows Smoke Accuracy"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -f "$log_path" ]]; then
            echo "No Windows smoke test log was found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! grep -q "max_abs_diff=" "$log_path"; then
            echo "No max_abs_diff lines were found in the Windows smoke test log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "| Check | max_abs_diff | Tolerance |"
            echo "| --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          grep "max_abs_diff=" "$log_path" | while IFS= read -r line; do
            clean="$(printf '%s\n' "$line" | sed 's/^\.*//')"
            if [[ "$clean" =~ ^(.+):[[:space:]]max_abs_diff=([^[:space:]]+)[[:space:]]tol=(.*)$ ]]; then
              name="${BASH_REMATCH[1]//|/\\|}"
              diff="${BASH_REMATCH[2]//|/\\|}"
              tol="${BASH_REMATCH[3]//|/\\|}"
              printf '| `%s` | `%s` | `%s` |\n' "$name" "$diff" "$tol" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
