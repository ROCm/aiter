name: Windows Smoke Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]
    paths:
      - ".github/workflows/windows-smoke-test.yaml"
      - "aiter/**"
      - "csrc/**"
      - "op_tests/windows/**"
      - "requirements.txt"
      - "setup.py"
  workflow_dispatch:
  schedule:
    # Run daily at 9 PM Beijing Time (UTC+8)
    - cron: '0 13 * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-signal:
    if: >-
      !github.event.pull_request ||
      (github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'ci:windows') ||
      contains(github.event.pull_request.labels.*.name, 'ci:all')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Checks workflow
        run: ./.github/scripts/check_signal.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}

  jit-op-smoke:
    name: JIT op smoke (gfx1201)
    if: >-
      !github.event.pull_request ||
      (github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'ci:windows') ||
      contains(github.event.pull_request.labels.*.name, 'ci:all')))
    needs: [check-signal]
    runs-on: windows-gfx1201-gpu-rocm
    timeout-minutes: 90
    env:
      GFX: gfx1201
      ROCM_INDEX: https://stable.repo.amd.com/rocm/whl-next/
      ROCM_VERSION: 10.1.0
      TORCH_VERSION: 2.14.0+rocm10.1.0
      AITER_USE_SYSTEM_TRITON: "1"
      # CK does not build on Windows yet; this smoke test covers JIT/Triton ops.
      ENABLE_CK: "0"
      PREBUILD_KERNELS: "0"

    steps:
      - name: Configure Git long paths
        shell: powershell
        run: git config --global core.longpaths true

      - name: Checkout aiter repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ env.GFX }}-rocm${{ env.ROCM_VERSION }}-torch${{ env.TORCH_VERSION }}

      - name: Install ROCm and PyTorch from ROCm pip index
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $venv = Join-Path $env:RUNNER_TEMP "aiter-windows-smoke"
          if (Test-Path $venv) {
            Remove-Item -Recurse -Force $venv
          }

          python --version
          python -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"

          & $python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $python -m pip install `
            --index-url "$env:ROCM_INDEX" `
            "torch[device-$env:GFX]==$env:TORCH_VERSION" `
            "rocm[devel,device-$env:GFX]==$env:ROCM_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $python -m rocm_sdk init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install aiter
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $venv = Join-Path $env:RUNNER_TEMP "aiter-windows-smoke"
          $python = Join-Path $venv "Scripts\python.exe"

          & $python -m pip install --upgrade `
            -r requirements.txt `
            wheel `
            "setuptools_scm<10" `
            triton-windows `
            numpy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $verifyRocm = @'
          import os
          import sys

          sys.path.insert(0, os.path.join(os.getcwd(), "aiter", "jit", "utils"))
          from cpp_extension import HIP_VERSION, IS_HIP_EXTENSION, ROCM_HOME, executable_path

          print(f"ROCM_HOME={ROCM_HOME!r}")
          print(f"HIP_VERSION={HIP_VERSION!r}")
          print(f"IS_HIP_EXTENSION={IS_HIP_EXTENSION}")

          if not ROCM_HOME or not IS_HIP_EXTENSION:
              raise SystemExit(
                  "ROCm toolchain was not detected after rocm_sdk init; "
                  "expected rocm[devel] to expose a usable HIP SDK."
              )

          for tool in ("hipconfig", "hipcc"):
              print(f"{tool}={executable_path(tool)}")
          '@

          $verifyPath = Join-Path $env:RUNNER_TEMP "verify-rocm-toolchain.py"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($verifyPath, $verifyRocm, $utf8NoBom)
          & $python $verifyPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $python -m pip install -e . --no-build-isolation -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run op_tests/windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $venv = Join-Path $env:RUNNER_TEMP "aiter-windows-smoke"
          $python = Join-Path $venv "Scripts\python.exe"
          $logPath = Join-Path $env:RUNNER_TEMP "windows-smoke-test.log"

          & $python -m pytest -q -s op_tests/windows 2>&1 | Tee-Object -FilePath $logPath
          $pytestStatus = $LASTEXITCODE
          if ($pytestStatus -ne 0) { exit $pytestStatus }

      - name: Summarize Windows smoke accuracy
        if: always()
        shell: powershell
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP "windows-smoke-test.log"

          "## Windows Smoke Accuracy" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY

          if (!(Test-Path $logPath)) {
            "No Windows smoke test log was found." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $lines = @(Get-Content $logPath | Where-Object { $_ -match "max_abs_diff=" })
          if ($lines.Count -eq 0) {
            "No max_abs_diff lines were found in the Windows smoke test log." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          "| Check | max_abs_diff | Tolerance |" >> $env:GITHUB_STEP_SUMMARY
          "| --- | ---: | --- |" >> $env:GITHUB_STEP_SUMMARY

          foreach ($line in $lines) {
            $clean = $line -replace '^\.+', ''
            if ($clean -match '^(?<name>.+?): max_abs_diff=(?<diff>\S+) tol=(?<tol>.*)$') {
              $name = $Matches["name"] -replace '\|', '\|'
              $diff = $Matches["diff"] -replace '\|', '\|'
              $tol = $Matches["tol"] -replace '\|', '\|'
              "| ``$name`` | ``$diff`` | ``$tol`` |" >> $env:GITHUB_STEP_SUMMARY
            }
          }
