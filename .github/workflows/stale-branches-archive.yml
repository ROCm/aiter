name: Archive stale branches

# Archives branches with no commits for 30 days, holds them 30 more, then gives
# two weeks' notice: 74 days from last commit to ref removal, 44 of them still
# reachable under archive/<date>/<name>. Replaces the comment-only
# stale-branches.yml, whose action can delete but cannot archive.
#
# Off until STALE_BRANCHES_ARCHIVE is 'true' -- every run reports and writes
# nothing until then. --max-actions caps each run, so the ~700 branches already
# past 30 days are worked off over weeks rather than in one morning.
#
# Exempt: protected branches, the head or base branch of an open pull request,
# and .github/stale-branch-exemptions.txt -- a checked-in list of names and re:
# patterns, edited by pull request, consulted at every stage against the
# original name so a new line also rescues an already-archived branch. The
# script refuses to run if that list is missing or empty.

on:
  schedule:
    - cron: '0 2 * * 1'   # Mondays, 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would happen without changing anything'
        type: boolean
        default: true
      max_actions:
        description: 'Most branches to touch in this run'
        type: string
        default: '50'

permissions:
  contents: write       # create and delete refs, comment on commits
  pull-requests: read   # head and base branches of open PRs are exempt

concurrency:
  group: stale-branches-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deletion goes through git push --force-with-lease, which is the
          # only compare-and-swap available -- the REST API has no conditional
          # delete -- so the checkout's credentials are what the script pushes
          # with. Default, stated because the delete stage depends on it.
          persist-credentials: true
          sparse-checkout: |
            .github/scripts/archive_stale_branches.py
            .github/stale-branch-exemptions.txt
          sparse-checkout-cone-mode: false

      - name: Archive, give notice, delete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Through the environment, never interpolated into the script: a
          # dispatch input expanded by ${{ }} is run by the shell before
          # argparse ever sees it, and this job holds contents: write.
          MAX_ACTIONS: ${{ inputs.max_actions || 50 }}
        run: |
          python3 .github/scripts/archive_stale_branches.py \
            --stale-days 30 \
            --archive-days 30 \
            --notice-days 14 \
            --exemptions .github/stale-branch-exemptions.txt \
            --max-actions "$MAX_ACTIONS" \
            ${{ (inputs.dry_run != true && vars.STALE_BRANCHES_ARCHIVE == 'true') && '--apply' || '' }}
