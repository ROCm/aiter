name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
      - docs-website
    paths:
      - 'docs/**'
      - 'aiter/**'
      - 'csrc/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'aiter/**'
      - 'csrc/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for versioning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Check example source contracts
        run: python docs/check_examples.py

      - name: Build Sphinx documentation
        run: sphinx-build -n -W --keep-going -b html docs docs/_build/html

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html/
          retention-days: 7

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/docs-website')

    permissions:
      contents: write  # For GitHub Pages deployment

    steps:
      - name: Download documentation artifacts
        uses: actions/download-artifact@v4
        timeout-minutes: 15
        with:
          name: documentation
          path: ./html

      - name: Verify documentation artifact
        run: |
          test -f ./html/index.html \
            || { echo "::error::documentation artifact is missing index.html"; exit 1; }

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./html
          force_orphan: true
          commit_message: 'docs: deploy documentation'

