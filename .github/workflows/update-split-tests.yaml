name: Update Split Tests

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      runs_count:
        description: "How many completed runs to sample from main"
        required: false
        default: "10"
      aggregate:
        description: "Aggregation mode for per-file duration"
        required: false
        default: "median"
        type: choice
        options:
          - median
          - mean

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      RUNS_COUNT: ${{ github.event.inputs.runs_count || '10' }}
      AGGREGATE: ${{ github.event.inputs.aggregate || 'median' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Update split test times from recent runs
        id: update_times
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/update_split_test_times.py \
            --repo "${REPO}" \
            --runs-count "${RUNS_COUNT}" \
            --aggregate "${AGGREGATE}" \
            --summary-path "${RUNNER_TEMP}/split-tests-update-summary.md"

      - name: Dry run rebalance check (aiter)
        run: bash .github/scripts/split_tests.sh --shards 8 --test-type aiter --dry-run

      - name: Dry run rebalance check (triton)
        run: bash .github/scripts/split_tests.sh --shards 8 --test-type triton --dry-run

      - name: Prepare PR body
        if: steps.update_times.outputs.changed == 'true'
        run: |
          {
            echo "## Summary"
            cat "${RUNNER_TEMP}/split-tests-update-summary.md"
            echo ""
            echo "## Test plan"
            echo "- [x] bash .github/scripts/split_tests.sh --shards 8 --test-type aiter --dry-run"
            echo "- [x] bash .github/scripts/split_tests.sh --shards 8 --test-type triton --dry-run"
          } > "${RUNNER_TEMP}/pr-body.md"

      - name: Generate PR GitHub App token
        if: steps.update_times.outputs.changed == 'true'
        id: pr_app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.AITER_CI_APP_ID }}
          private-key: ${{ secrets.AITER_CI_APP_PRIVATE_KEY }}
          owner: ROCm
          repositories: aiter

      - name: Create Pull Request
        if: steps.update_times.outputs.changed == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ steps.pr_app_token.outputs.token }}
          branch: ci/update-split-tests-file-times
          title: "CI: auto-update split test times"
          assignees: gyohuangxin
          body-path: ${{ runner.temp }}/pr-body.md
          # Without this the action commits every dirty file in the workspace,
          # which is how its own PR body and summary reached the repo root in
          # #5131. This job only ever means to change split test timing data.
          add-paths: |
            .github/split-test-times/aiter.tsv
            .github/split-test-times/triton.tsv
          commit-message: "CI: auto-update split test times"
          delete-branch: true
