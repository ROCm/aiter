name: aiter-test-failure-report

on:
  schedule:
    # The main Aiter Test run starts at 22:00 UTC. Run later so the scheduled
    # suite usually has time to finish before this report scans for failures.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional Aiter Test workflow run id to analyze"
        required: false
        type: string
      lookback:
        description: "Number of recent Aiter Test runs to scan when run_id is empty"
        required: false
        default: "120"
        type: string

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: aiter-test-failure-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: [self-hosted, box308-pr-revert]
    timeout-minutes: 60
    env:
      AITER_TEST_FAILURE_RUN_ID: ${{ github.event.inputs.run_id || '' }}
      AITER_TEST_FAILURE_LOOKBACK: ${{ github.event.inputs.lookback || '120' }}
      AITER_TEST_FAILURE_AGENT: ${{ vars.AITER_TEST_FAILURE_AGENT }}
      AITER_TEST_FAILURE_AGENT_TIMEOUT: ${{ vars.AITER_TEST_FAILURE_AGENT_TIMEOUT || '1800' }}
      AITER_TEST_FAILURE_WORKDIR: .aiter-test-failure-report-${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Analyze latest Aiter Test failure
        run: .claude/skills/aiter-test-failure-analysis/scripts/run_report.sh "${GITHUB_REPOSITORY}"

      - name: Upload structured failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiter-test-failure-report-${{ github.run_id }}
          path: |
            ${{ env.AITER_TEST_FAILURE_WORKDIR }}/evidence.json
            ${{ env.AITER_TEST_FAILURE_WORKDIR }}/culprit.json
            ${{ env.AITER_TEST_FAILURE_WORKDIR }}/evidence.md
            ${{ env.AITER_TEST_FAILURE_WORKDIR }}/fallback_report.md
          if-no-files-found: warn
          retention-days: 7

  auto_revert:
    name: Handle culprit report
    needs: report
    if: ${{ needs.report.result == 'success' }}
    runs-on: [self-hosted, box308-pr-revert]
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      AITER_BOT_TOKEN: ${{ secrets.AITER_BOT_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download structured failure report
        uses: actions/download-artifact@v8.0.1
        with:
          name: aiter-test-failure-report-${{ github.run_id }}
          path: ${{ runner.temp }}/aiter-test-failure-report

      - name: Create revert PR or low-confidence issue
        env:
          AITER_TEST_FAILURE_WORKDIR: ${{ runner.temp }}/aiter-test-failure-report
        run: .claude/skills/aiter-test-failure-analysis/scripts/create_revert_pr.py --repo "${GITHUB_REPOSITORY}"
